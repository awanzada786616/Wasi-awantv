<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <!-- LIBRARIES -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Pro Max</title>

    <style>
        :root { --primary: #ff9800; --bg: #000; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; padding-bottom: 80px; overflow-x: hidden; }
        
        /* Layout CSS... (Sama as your old code) */
        header { padding: 12px; text-align: center; background: #121212; position: sticky; top: 0; z-index: 900; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary); font-size: 20px; margin: 0; font-weight: 900; text-transform: uppercase; flex: 1; text-align: center; }
        #slider-container { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; position: relative; margin-top: 10px; display: none; background: #000; }
        .slide { width: 100%; height: 100%; position: absolute; opacity: 0; transition: 0.6s; }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 15px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; text-align: center; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 8px; }
        .card.portrait img { aspect-ratio: 2/3; object-fit: cover; padding: 0; }
        .card-title { font-size: 9px; font-weight: 700; color: #000; padding: 5px 2px; }

        /* --- ADVANCED PLAYER CSS --- */
        #player-overlay { 
            display: none; position: fixed; inset: 0; background: #000; z-index: 99999; 
            width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: top left; 
            margin-left: 100vw; overflow: hidden; touch-action: none;
        }
        #main-video { width: 100%; height: 100%; background: #000; }
        
        /* Gesture Info Spinner (The 100% Circle) */
        #gesture-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: rgba(0,0,0,0.7); border-radius: 50%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border: 2px solid var(--primary); color: #fff;
        }
        #gesture-box i { font-size: 24px; margin-bottom: 4px; }
        #gesture-box span { font-weight: bold; font-size: 14px; }

        /* Video Controls UI */
        .ui-wrapper { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; transition: 0.3s; }
        .ui-hidden { opacity: 0; pointer-events: none; }
        
        .top-bar { padding: 20px; display: flex; align-items: center; gap: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .center-controls { flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; }
        .center-controls i { font-size: 40px; color: #fff; opacity: 0.9; }
        .center-controls i:active { transform: scale(1.2); color: var(--primary); }
        
        .bottom-bar { padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .seek-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .seek-bar { flex: 1; accent-color: var(--primary); height: 4px; }
        
        #brightness-dim { position: absolute; inset: 0; background: black; opacity: 0; pointer-events: none; z-index: 5; }
        #video-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
        .v-spin { width: 50px; height: 50px; border: 4px solid rgba(255,152,0,0.2); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Bottom Nav... */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; display: flex; padding: 10px 0; border-top: 1px solid #333; z-index: 2000; }
        .nav-item { color: #888; text-align: center; flex: 1; font-size: 10px; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <h1>Wasi TV</h1>
        <i class="fa-solid fa-bell" style="color:var(--primary); font-size:20px;"></i>
    </header>

    <div id="slider-container"></div>
    <div id="main-content">
        <div class="playlist-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay">
        <div id="brightness-dim"></div>
        
        <!-- Gesture Info (Spinner 100%) -->
        <div id="gesture-box">
            <i id="gesture-icon" class="fa-solid fa-volume-high"></i>
            <span id="gesture-percent">100%</span>
        </div>

        <div id="video-spinner"><div class="v-spin"></div></div>
        
        <video id="main-video" playsinline></video>

        <div class="ui-wrapper" id="player-ui">
            <div class="top-bar">
                <i class="fa-solid fa-arrow-left" onclick="closePlayer()" style="font-size:24px;"></i>
                <span id="p-title" style="font-weight:bold; font-size:18px;">Channel Name</span>
            </div>

            <div class="center-controls">
                <i class="fa-solid fa-rotate-left" onclick="video.currentTime -= 10"></i>
                <i class="fa-solid fa-play" id="pp-btn" style="font-size: 60px;" onclick="togglePlay()"></i>
                <i class="fa-solid fa-rotate-right" onclick="video.currentTime += 10"></i>
            </div>

            <div class="bottom-bar">
                <div class="seek-container">
                    <span id="curr-time" style="font-size:12px;">00:00</span>
                    <input type="range" class="seek-bar" id="seekbar" min="0" max="100" value="0" oninput="manualSeek(this.value)">
                    <span id="dur-time" style="font-size:12px;">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="loadTab('trending', this)"><i class="fa-solid fa-fire"></i>Trending</div>
    </div>

    <script>
        const API = "https://wasitv.lovable.app/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls({ 
            capLevelToPlayerSize: true,
            maxBufferLength: 30,
            progressive: true,
            lowLatencyMode: true 
        });

        let uiTimer;
        let startY, startVal, isGesturing = false;

        // PLAYER UI TOGGLE
        $('#player-overlay').on('click', function(e) {
            if(e.target.id === 'player-overlay' || e.target.id === 'main-video') {
                $('#player-ui').toggleClass('ui-hidden');
            }
        });

        // GESTURE CONTROLS (Brightness & Volume)
        const player = document.getElementById('player-overlay');
        player.addEventListener('touchstart', e => {
            startY = e.touches[0].pageY;
            const x = e.touches[0].pageX;
            // X is reversed because of 90deg rotation
            if (x < window.innerWidth / 2) { // Right side of screen (Volume)
                startVal = video.volume;
                $('#gesture-icon').attr('class', 'fa-solid fa-volume-high');
            } else { // Left side of screen (Brightness)
                startVal = parseFloat($('#brightness-dim').css('opacity'));
                $('#gesture-icon').attr('class', 'fa-solid fa-sun');
            }
        });

        player.addEventListener('touchmove', e => {
            isGesturing = true;
            const currentY = e.touches[0].pageY;
            const diff = (startY - currentY) / 200; // Sensitivity
            const x = e.touches[0].pageX;

            $('#gesture-box').css('display', 'flex');

            if (x < window.innerWidth / 2) {
                // Volume Logic
                let newVal = Math.min(1, Math.max(0, startVal + diff));
                video.volume = newVal;
                $('#gesture-percent').text(Math.round(newVal * 100) + "%");
            } else {
                // Brightness Logic (Dimmer)
                let newVal = Math.min(0.9, Math.max(0, startVal - diff));
                $('#brightness-dim').css('opacity', newVal);
                let displayBr = Math.round((1 - newVal) * 100);
                $('#gesture-percent').text(displayBr + "%");
            }
        });

        player.addEventListener('touchend', () => {
            setTimeout(() => { $('#gesture-box').hide(); }, 500);
            isGesturing = false;
        });

        // STREAM LOGIC
        async function playStream(slug, type, name) {
            $('#p-title').text(name);
            $('#player-overlay').show();
            $('#video-spinner').show();
            
            let finalUrl = slug;
            if(!slug.startsWith('http')) {
                const res = await fetch(`${API}/stream?slug=${slug}&type=${type}`).then(r=>r.json());
                finalUrl = res.url;
            }

            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls({ maxBufferLength: 10 });
                hls.loadSource(finalUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = finalUrl;
                video.play();
            }
        }

        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function closePlayer() { video.pause(); video.src = ""; $('#player-overlay').hide(); }
        function manualSeek(v) { video.currentTime = (v/100) * video.duration; }

        video.onplaying = () => { 
            $('#video-spinner').hide(); 
            $('#pp-btn').attr('class', 'fa-solid fa-pause'); 
        };
        video.onpause = () => { $('#pp-btn').attr('class', 'fa-solid fa-play'); };
        
        video.ontimeupdate = () => {
            const perc = (video.currentTime / video.duration) * 100 || 0;
            $('#seekbar').val(perc);
            let m = Math.floor(video.currentTime / 60), s = Math.floor(video.currentTime % 60);
            $('#curr-time').text((m < 10 ? '0' : '') + m + ":" + (s < 10 ? '0' : '') + s);
        };

        // Tab Loader (simplified)
        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); $(el).addClass('active');
            $('#main-content').html('<div class="playlist-grid">Loading...</div>');
            const d = await fetch(`${API}/feed`).then(r=>r.json());
            $('#main-content').empty();
            let html = `<div class="playlist-grid">`;
            d.channels.forEach(i => {
                html += `<div class="card" onclick="playStream('${i.channelSlug}', 'channel', '${i.channelName}')"><img src="${i.logo}"><div class="card-title">${i.channelName}</div></div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        $(document).ready(() => loadTab('home', $('.nav-item').first()));
    </script>
</body>
</html>
