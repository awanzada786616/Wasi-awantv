<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — White Ultimate Pro</title>

    <style>
        :root { --primary: #ff9800; --bg: #ffffff; --border: #eeeeee; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #000; padding-bottom: 80px; overflow-x: hidden; }

        header { padding: 12px; text-align: center; background: #fff; position: sticky; top: 0; z-index: 900; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary); font-size: 20px; margin: 0; font-weight: 900; }

        .notif-btn { position: relative; cursor: pointer; color: var(--primary); font-size: 22px; padding: 5px; }
        #notif-badge { position: absolute; top: 0; right: 0; background: red; color: #fff; font-size: 10px; font-weight: bold; width: 17px; height: 17px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid #fff; }

        #slider-container { width: 94%; aspect-ratio: 16/8; margin: 10px auto; border-radius: 12px; overflow: hidden; position: relative; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .slide { width: 100%; height: 100%; position: absolute; opacity: 0; transition: 0.8s; }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        .section-title { padding: 15px 15px 0; font-size: 14px; font-weight: bold; color: var(--primary); text-transform: uppercase; }
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 15px; }
        .card { background: #fff; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; text-align: center; cursor: pointer; position: relative; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 8px; }
        .card.portrait img { aspect-ratio: 2/3; object-fit: cover; padding: 0; }
        .card-title { font-size: 9px; font-weight: 700; color: #333; padding: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pro-badge { position: absolute; top: 5px; right: 5px; background: #e6b800; color: #000; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }

        #ep-modal { position: fixed; inset: 0; background: #fff; z-index: 5000; display: none; overflow-y: auto; padding-bottom: 50px; }
        .ep-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; position: sticky; top: 0; background: #fff; z-index: 10; }
        .ep-list { padding: 15px; }
        .ep-item { background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; border: 1px solid #eee; font-size: 14px; font-weight: bold; }

        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: top left; margin-left: 100vw; touch-action: none; }
        #main-video { width: 100%; height: 100%; }
        #gesture-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: rgba(0,0,0,0.7); border-radius: 50%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; border: 2px solid var(--primary); color: #fff; }

        .play-wrapper { position: relative; width: 85px; height: 85px; display: flex; align-items: center; justify-content: center; }
        #pp-btn { font-size: 55px; color: #fff; z-index: 10; cursor: pointer; }
        #btn-loader { position: absolute; inset: 0; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-ui { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; transition: 0.3s; color: #fff; }
        .ui-hidden { opacity: 0; pointer-events: none; }
        .p-top { padding: 20px 30px; display: flex; align-items: center; gap: 15px; }
        .p-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 60px; }
        .p-bottom { padding: 20px 40px; }
        .p-seekbar { width: 100%; accent-color: var(--primary); height: 4px; }

        .nav-item { color: #999; text-align: center; flex: 1; font-size: 10px; font-weight: 900; }
        .nav-item.active { color: var(--primary); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; padding: 10px 0; border-top: 1px solid var(--border); z-index: 2000; }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <h1>Wasi TV</h1>
        <div class="notif-btn" onclick="history.pushState(null, '', '#notif'); loadTab('notif', this)">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="slider-container"></div>
    <div id="main-content"></div>

    <div id="ep-modal">
        <div class="ep-header">
            <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size:22px; margin-right:15px;"></i>
            <h2 id="ep-title" style="margin:0; font-size:17px; color:var(--primary); flex:1;">Episodes</h2>
        </div>
        <div id="ep-desc" style="padding:15px; font-size:13px; color:#666;"></div>
        <div id="ep-list-content" class="ep-list"></div>
    </div>

    <div id="player-overlay" onclick="togglePlayerUI()">
        <div id="gesture-box"><i class="fa-solid fa-volume-high"></i><span id="gesture-percent">100%</span></div>
        <video id="main-video" playsinline></video>
        <div class="player-ui">
            <div class="p-top">
                <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size:24px;"></i>
                <span id="p-title" style="font-weight:bold; flex:1;">Channel</span>
            </div>
            <div class="p-center">
                <i class="fa-solid fa-rotate-left" onclick="event.stopPropagation(); video.currentTime -= 5"></i>
                <div class="play-wrapper">
                    <div id="btn-loader"></div>
                    <i class="fa-solid fa-circle-pause" id="pp-btn" onclick="event.stopPropagation(); togglePlay()"></i>
                </div>
                <i class="fa-solid fa-rotate-right" onclick="event.stopPropagation(); video.currentTime += 15"></i>
            </div>
            <div class="p-bottom">
                <input type="range" class="p-seekbar" id="seekbar" min="0" max="100" value="0" oninput="event.stopPropagation(); manualSeek(this.value)">
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:5px; font-weight:bold;">
                    <span id="curr-time">00:00</span><span id="dur-time">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="history.pushState(null, '', '#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="history.pushState(null, '', '#tv'); loadTV(this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="history.pushState(null, '', '#trending'); loadTrending(this)"><i class="fa-solid fa-fire"></i>Trending</div>
        <div class="nav-item" onclick="history.pushState(null, '', '#missing'); loadTab('missing', this)"><i class="fa-solid fa-trophy"></i>Missing</div>
    </div>

    <script>
        // ROUTING SYSTEM FOR BACK BUTTON
        window.onpopstate = function(event) {
            const hash = window.location.hash;
            if (hash === "" || hash === "#home") {
                closePlayer();
                $('#ep-modal').fadeOut();
                loadTab('home', $('.nav-item').first());
            } else if (hash === "#player") {
                // Keep player open
            } else if (hash === "#tv") {
                loadTV();
            } else if (hash === "#trending") {
                loadTrending();
            } else {
                closePlayer();
                $('#ep-modal').fadeOut();
            }
        };

        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls({ lowLatencyMode: true });
        let sliderInt, feedCache = null, moviesCache = null;

        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const getFeed = () => feedCache || (feedCache = fetch(`${API}/feed`).then(r => r.json()));
        const getMovies = () => moviesCache || (moviesCache = fetch(`${API}/movies`).then(r => r.json()));

        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content, #slider-container').hide();
            if(tab === 'home') {
                const feed = await getFeed();
                renderSlider(feed.slider);
                $('#main-content').show().html('');
                renderSection('Live Free Sports', feed.sports);
            } else if(tab === 'missing') {
                $('#main-content').show().html('');
                db.ref('missing_sports').once('value', s => renderSection('Missing Sports', Object.values(s.val() || {})));
            } else if(tab === 'notif') {
                $('#main-content').show().html('<div style="padding:20px;"><h2>Notifications</h2><div id="notif-list"></div></div>');
                loadInbox();
            }
        }

        async function loadTV(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#slider-container').hide(); $('#main-content').show().html('');
            const feed = await getFeed();
            renderSection('All Live TV', feed.channels);
        }

        async function loadTrending(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#slider-container').hide(); $('#main-content').show().html('');
            const sections = await getMovies();
            sections.forEach(sec => renderSection(sec.title, sec.items));
        }

        function renderSection(title, items) {
            if(!items || items.length === 0) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const portrait = (i.type !== 'channel') ? 'portrait' : '';
                html += `<div class="card ${portrait}" onclick="handleClick('${i.slug}', '${i.type}', '${i.name || i.channelName}')">
                    <img src="${i.image || i.logo}" loading="lazy">
                    ${i.isFree === false ? '<span class="pro-badge">PRO</span>' : ''}
                    <div class="card-title">${i.name || i.channelName}</div>
                </div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        function handleClick(slug, type, name) {
            if (type === 'program' || type === 'series') {
                history.pushState(null, '', '#episodes');
                loadEpisodes(slug, name);
            } else {
                history.pushState(null, '', '#player');
                playStream(slug, type || 'channel', name);
            }
        }

        async function loadEpisodes(slug, name) {
            $('#ep-title').text(name);
            $('#ep-list-content').html('<p style="text-align:center;">Loading Episodes...</p>');
            $('#ep-modal').fadeIn();
            try {
                const data = await fetch(`${API}/program?slug=${encodeURIComponent(slug)}`).then(r => r.json());
                $('#ep-desc').text(data.description || '');
                let html = data.episodes.map(ep => `<div class="ep-item" onclick="history.pushState(null,'','#player'); playStream('${ep.slug}', 'episode', '${ep.name}')">
                    <span>${ep.name} ${ep.isFree === false ? '<b style="color:red">(PRO)</b>' : ''}</span>
                    <i class="fa-solid fa-play-circle" style="color:var(--primary); font-size:20px;"></i>
                </div>`).join('');
                $('#ep-list-content').html(html || 'No episodes found.');
            } catch (e) { $('#ep-list-content').html('Error loading episodes.'); }
        }

        async function playStream(slug, type, name) {
            $('#ep-modal').hide();
            $('#p-title').text(name);
            $('#player-overlay').show(); $('#btn-loader').show();
            let url = slug.startsWith('http') ? slug : (await fetch(`${API}/stream?slug=${slug}&type=${type}`).then(r=>r.json())).url;
            if (Hls.isSupported()) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').hide(); }

        // Rest of your functions (gestures, seekbar etc.) remain same...
        let startY, startVol;
        document.getElementById('player-overlay').addEventListener('touchstart', e => { startY = e.touches[0].pageY; startVol = video.volume; });
        document.getElementById('player-overlay').addEventListener('touchmove', e => {
            const v = Math.min(1, Math.max(0, startVol + (startY - e.touches[0].pageY) / 200));
            video.volume = v;
            $('#gesture-box').css('display', 'flex').find('#gesture-percent').text(Math.round(v * 100) + "%");
        });
        document.getElementById('player-overlay').addEventListener('touchend', () => setTimeout(() => $('#gesture-box').hide(), 500));

        video.onplaying = () => { $('#btn-loader').hide(); $('#pp-btn').attr('class', 'fa-solid fa-circle-pause'); };
        video.onwaiting = () => { $('#btn-loader').show(); };
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime/video.duration)*100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#curr-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };
        function togglePlayerUI() { $('.player-ui').toggleClass('ui-hidden'); }
        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function manualSeek(v) { video.currentTime = (v/100) * video.duration; }

        function renderSlider(data) {
            if(!data) return;
            let html = data.map((s, i) => `<div class="slide ${i===0?'active':''}" onclick="handleClick('${s.slug}','${s.type}','${s.name}')"><img src="${s.image}"></div>`).join('');
            $('#slider-container').html(html).show();
            clearInterval(sliderInt);
            sliderInt = setInterval(() => {
                let cur = $('.slide.active'), nxt = cur.next().length ? cur.next() : $('.slide').first();
                cur.removeClass('active'); nxt.addClass('active');
            }, 4000);
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_notif') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).show();
        });

        function loadInbox() {
            db.ref('app_notifications').once('value', s => {
                localStorage.setItem('seen_notif', Object.keys(s.val() || {}).length);
                $('#notif-badge').hide();
                let html = Object.values(s.val() || {}).reverse().map(n => `<div style="background:#f9f9f9; padding:12px; border-radius:8px; margin-bottom:10px; border-left:5px solid orange;"><h3>${n.title}</h3><p>${n.message}</p></div>`).join('');
                $('#notif-list').html(html || 'No messages');
            });
        }
        $(document).ready(() => {
            history.replaceState(null, '', '#home');
            loadTab('home', $('.nav-item').first());
        });
    </script>
</body>
</html>
