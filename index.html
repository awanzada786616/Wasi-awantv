<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Black Pro Edition</title>

    <style>
        :root { --primary: #ff9800; --bg: #000000; --card-bg: #121212; --border: #1f1f1f; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

        header { padding: 15px; text-align: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 900; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary); font-size: 22px; margin: 0; font-weight: 800; letter-spacing: 1px; }

        .notif-btn { position: relative; cursor: pointer; color: var(--primary); font-size: 22px; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: #ff3b30; color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid var(--bg); }

        /* SLIDER */
        #slider-container { width: 94%; aspect-ratio: 16/9; margin: 15px auto; border-radius: 15px; overflow: hidden; position: relative; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* GRID & CARDS */
        .section-title { padding: 20px 15px 5px; font-size: 15px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1.5px; }
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; text-align: center; transition: 0.3s; position: relative; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 10px; transition: 0.3s; }
        .card.portrait img { aspect-ratio: 2/3; object-fit: cover; padding: 0; }
        .card-title { font-size: 10px; font-weight: 600; color: #eee; padding: 8px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pro-badge { position: absolute; top: 8px; right: 8px; background: var(--primary); color: #000; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* PLAYER OVERLAY */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: top left; margin-left: 100vw; }
        #main-video { width: 100%; height: 100%; }

        /* IMPROVED BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(15px); display: flex; padding: 12px 5px; border-top: 1px solid var(--border); z-index: 2000; justify-content: space-around; box-shadow: 0 -5px 20px rgba(0,0,0,0.4); }
        .nav-item { color: #555; text-align: center; flex: 1; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; gap: 4px; transition: 0.3s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); }
        .nav-item.active i { filter: drop-shadow(0 0 8px var(--primary)); }

        /* LOADING SPINNER */
        #btn-loader { position: absolute; width: 80px; height: 80px; border: 4px solid rgba(255,152,0,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <h1>WASI TV</h1>
        <div class="notif-btn" onclick="goToHash('#notif'); loadTab('notif', this)">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="slider-container"></div>
    <div id="main-content"></div>

    <!-- Episode Modal -->
    <div id="ep-modal" style="position:fixed; inset:0; background:#000; z-index:5000; display:none;">
        <div style="padding:15px; border-bottom:1px solid #222; display:flex; align-items:center;">
            <i class="fa-solid fa-chevron-left" onclick="history.back()" style="font-size:24px; color:var(--primary);"></i>
            <h2 id="ep-title" style="margin:0 15px; font-size:18px;">Episodes</h2>
        </div>
        <div id="ep-list-content" style="padding:15px;"></div>
    </div>

    <!-- PLAYER -->
    <div id="player-overlay" onclick="togglePlayerUI()">
        <video id="main-video" playsinline></video>
        <div class="player-ui" style="position:absolute; inset:0; display:flex; flex-direction:column; background:rgba(0,0,0,0.5); padding:20px;">
             <div style="display:flex; align-items:center; gap:20px;">
                <i class="fa-solid fa-xmark" onclick="history.back()" style="font-size:30px; color:#fff;"></i>
                <span id="p-title" style="font-size:18px; font-weight:bold;">Live Stream</span>
             </div>
             <div style="flex:1; display:flex; justify-content:center; align-items:center;">
                <div id="btn-loader"></div>
                <i class="fa-solid fa-play" id="pp-btn" style="font-size:60px; color:#fff;" onclick="event.stopPropagation(); togglePlay()"></i>
             </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-grid-2"></i>Home</div>
        <div class="nav-item" onclick="goToHash('#tv'); loadTV(this)"><i class="fa-solid fa-tv"></i>TV</div>
        <div class="nav-item" onclick="goToHash('#trending'); loadTrending(this)"><i class="fa-solid fa-bolt"></i>Trending</div>
        <div class="nav-item" onclick="goToHash('#notif'); loadTab('notif', this)"><i class="fa-solid fa-bell"></i>Inbox</div>
    </div>

    <script>
        // --- BACK BUTTON & ROTATION LOGIC ---
        function goToHash(hash) { history.pushState(null, '', hash); }

        window.onpopstate = function() {
            const h = window.location.hash;
            if (h === "" || h === "#home") {
                closePlayer();
                $('#ep-modal').hide();
                loadTab('home', $('.nav-item').first());
            } else if (h === "#player") {
                // Stay in player
            } else {
                closePlayer();
                $('#ep-modal').hide();
            }
        };

        function closePlayer() {
            video.pause();
            $('#player-overlay').hide();
            // Android ko signal: Seedha ho jao
            if(window.Android) window.Android.rotatePortrait();
        }

        async function playStream(slug, type, name) {
            goToHash('#player');
            // Android ko signal: Teerha ho jao (Landscape)
            if(window.Android) window.Android.rotateLandscape();
            
            $('#p-title').text(name);
            $('#player-overlay').show(); $('#btn-loader').show();
            let url = slug.startsWith('http') ? slug : (await fetch(`${API}/stream?slug=${slug}&type=${type}`).then(r=>r.json())).url;
            if (Hls.isSupported()) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else { video.src = url; video.play(); }
        }

        // --- BAKI DATA LOGIC ---
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content, #slider-container').hide();
            if(tab === 'home') {
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderSlider(r.slider);
                $('#main-content').show().html('');
                renderSection('Live Sports', r.sports);
            }
        }

        async function loadTV(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#slider-container').hide(); $('#main-content').show().html('');
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            renderSection('All Channels', r.channels);
        }

        async function loadTrending(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#slider-container').hide(); $('#main-content').show().html('');
            const r = await fetch(`${API}/movies`).then(r=>r.json());
            r.forEach(sec => renderSection(sec.title, sec.items));
        }

        function renderSection(title, items) {
            if(!items) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const portrait = (i.type !== 'channel') ? 'portrait' : '';
                html += `<div class="card ${portrait}" onclick="handleClick('${i.slug}', '${i.type}', '${i.name || i.channelName}')">
                    <img src="${i.image || i.logo}" loading="lazy">
                    ${i.isFree === false ? '<span class="pro-badge">PRO</span>' : ''}
                    <div class="card-title">${i.name || i.channelName}</div>
                </div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        function handleClick(slug, type, name) {
            if (type === 'program' || type === 'series') {
                goToHash('#episodes');
                loadEpisodes(slug, name);
            } else playStream(slug, type || 'channel', name);
        }

        function togglePlay() { video.paused ? video.play() : video.pause(); }
        video.onplaying = () => { $('#btn-loader').hide(); $('#pp-btn').attr('class', 'fa-solid fa-circle-pause'); };

        $(document).ready(() => {
            history.replaceState(null, '', '#home');
            loadTab('home', $('.nav-item').first());
        });
    </script>
</body>
</html>
