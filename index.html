<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Ultimate</title>

    <style>
        :root { --primary: #f07d3a; --bg: #000; --card-bg: #fff; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: #121212; color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        /* HEADER */
        header { padding: 15px; background: #000; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .pill-logo { background: #d32f2f; color: #fff; padding: 4px 35px; border-radius: 20px; font-weight: 900; font-size: 18px; }
        .notif-icon { position: absolute; right: 20px; font-size: 22px; color: #fff; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: #ff0000; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 1px solid #000; }

        /* SKELETON */
        .skeleton { background: #222; background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%); background-size: 200% 100%; animation: skeleton-hi 1.5s infinite; border-radius: 10px; }
        @keyframes skeleton-hi { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* CONTENT GRID */
        .section-title { padding: 15px 15px 5px; font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
        
        /* JAZZ TV BOX LOOK */
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #333; display: flex; flex-direction: column; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 10px; }
        .card-name { background: #fff; color: #000; padding: 6px 2px; font-size: 10px; font-weight: 900; text-align: center; white-space: nowrap; overflow: hidden; border-top: 1px solid #eee; text-transform: uppercase; }

        /* --- PROFESSIONAL PLAYER --- */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }

        /* Perfectly Centered Spinner */
        .spinner-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 100; }
        .arc-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,152,0,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: rotate 0.8s linear infinite; display: none; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* Player Controls UI */
        .p-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transition: 0.4s opacity; }
        .ui-hidden { opacity: 0; pointer-events: none; }

        .p-top { display: flex; align-items: center; justify-content: space-between; }
        .p-title { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 15px; }

        .p-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 60px; }
        .p-center i { font-size: 30px; color: #fff; cursor: pointer; text-shadow: 0 0 15px rgba(0,0,0,0.8); }
        #play-btn { font-size: 60px; }

        .p-bottom { width: 100%; }
        .seekbar-container { display: flex; align-items: center; gap: 12px; }
        .seekbar { flex: 1; accent-color: var(--primary); height: 4px; cursor: pointer; }
        .time-label { font-size: 11px; font-weight: 700; }

        /* NAVIGATION & FAB */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; padding: 10px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; color: #666; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: var(--primary); padding: 6px 25px; border-radius: 20px; margin-top: -5px; }

        .wa-btn { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 999; }
        
        /* NOTIFICATION CARD */
        .n-card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin: 10px; border-left: 4px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <header>
        <div class="pill-logo">Jazz Tv</div>
        <div class="notif-icon" onclick="loadTab('notif')">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="app-content"></div>

    <a href="https://wa.me/923342002756" class="wa-btn"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay">
        <div class="spinner-box"><div class="arc-spinner" id="loader"></div></div>
        
        <video id="main-video" playsinline onclick="toggleControls()"></video>

        <div class="p-ui" id="p-controls">
            <div class="p-top">
                <div class="p-title">
                    <i class="fa-solid fa-arrow-left" onclick="closePlayer()"></i>
                    <span id="video-name">Wasi TV Pro</span>
                </div>
                <div style="display:flex; gap:20px; font-size:20px;">
                    <i class="fa-solid fa-chromecast"></i>
                    <i class="fa-solid fa-lock-open"></i>
                </div>
            </div>

            <div class="p-center">
                <i class="fa-solid fa-rotate-left" onclick="video.currentTime -= 10"></i>
                <i class="fa-solid fa-play" id="play-btn" onclick="togglePlay()"></i>
                <i class="fa-solid fa-rotate-right" onclick="video.currentTime += 10"></i>
            </div>

            <div class="p-bottom">
                <div class="seekbar-container">
                    <span class="time-label" id="cur-time">00:00</span>
                    <input type="range" class="seekbar" id="seekbar" value="0" step="0.1" oninput="manualSeek(this.value)">
                    <span class="time-label" id="total-time">00:00</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:8px;">
                    <span style="color:red; font-size:10px; font-weight:900; letter-spacing:1px;"><i class="fa-solid fa-circle"></i> LIVE</span>
                    <i class="fa-solid fa-expand"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- NAV BAR -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="loadTab('movies', this)"><i class="fa-solid fa-clapperboard"></i>Movies</div>
        <div class="nav-item" onclick="loadTab('missing', this)"><i class="fa-solid fa-triangle-exclamation"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load Skeleton
        function showLoading() {
            let h = '<div class="grid">';
            for(let i=0; i<9; i++) h += '<div class="skeleton" style="aspect-ratio:1/1.2;"></div>';
            $('#app-content').html(h + '</div>');
        }

        async function loadTab(tab, el) {
            if(el) { $('.nav-item').removeClass('active'); $(el).addClass('active'); }
            showLoading();

            if(tab === 'tv' || tab === 'home') {
                const res = await fetch(`${API}/feed`).then(r => r.json());
                const items = tab === 'tv' ? res.channels : res.sports;
                renderGrid(tab === 'tv' ? 'All Channels' : 'Live Sports', items);
            } 
            else if(tab === 'movies') {
                const res = await fetch(`${API}/movies`).then(r => r.json());
                let h = '';
                res.forEach(s => {
                    h += `<div class="section-title">${s.title}</div><div class="grid">`;
                    s.items.forEach(i => h += createCard(i));
                    h += '</div>';
                });
                $('#app-content').html(h);
            }
            else if(tab === 'missing') {
                db.ref('missing_sports').once('value', s => {
                    renderGrid('Missing Channels', Object.values(s.val() || {}));
                });
            }
            else if(tab === 'notif') {
                db.ref('app_notifications').once('value', s => {
                    const data = s.val() || {};
                    localStorage.setItem('seen_count', Object.keys(data).length);
                    $('#notif-badge').hide();
                    let h = '<div class="section-title">Inbox</div>';
                    Object.values(data).reverse().forEach(n => {
                        h += `<div class="n-card"><b>${n.title}</b><p style="margin:5px 0 0; font-size:12px; color:#aaa;">${n.message}</p></div>`;
                    });
                    $('#app-content').html(h || '<p style="text-align:center; margin-top:50px; color:#555;">No Messages</p>');
                });
            }
        }

        function createCard(i) {
            const name = i.name || i.channelName || "No Name";
            const img = i.logo || i.image || "https://via.placeholder.com/150";
            return `<div class="card" onclick="playStream('${i.slug}','${name}')">
                <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                <div class="card-name">${name}</div>
            </div>`;
        }

        function renderGrid(title, items) {
            let h = `<div class="section-title">${title}</div><div class="grid">`;
            items.forEach(i => h += createCard(i));
            $('#app-content').html(h + '</div>');
        }

        // --- PLAYER SYSTEM ---
        function playStream(slug, name) {
            $('#video-name').text(name);
            $('#player-overlay').fadeIn();
            $('#loader').show();
            if(window.Android) window.Android.rotateLandscape();

            let url = slug.startsWith('http') ? slug : `${API}/stream?slug=${slug}&type=channel`;
            
            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        function closePlayer() { 
            video.pause(); 
            $('#player-overlay').fadeOut(); 
            if(window.Android) window.Android.rotatePortrait(); 
        }

        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function manualSeek(v) { video.currentTime = (v / 100) * video.duration; }

        function toggleControls() {
            $('#p-controls').toggleClass('ui-hidden');
        }

        video.onwaiting = () => $('#loader').show();
        video.onplaying = () => { 
            $('#loader').hide(); 
            $('#play-btn').attr('class', 'fa-solid fa-pause');
            setTimeout(() => $('#p-controls').addClass('ui-hidden'), 3000);
        };
        video.onpause = () => {
            $('#play-btn').attr('class', 'fa-solid fa-play');
            $('#p-controls').removeClass('ui-hidden');
        };

        video.ontimeupdate = () => {
            const cur = video.currentTime, dur = video.duration || 0;
            $('#seekbar').val((cur / dur) * 100 || 0);
            $('#cur-time').text(formatTime(cur));
            $('#total-time').text(formatTime(dur));
        };

        function formatTime(s) {
            let m = Math.floor(s / 60);
            s = Math.floor(s % 60);
            return (m < 10 ? '0' : '') + m + ":" + (s < 10 ? '0' : '') + s;
        }

        // Firebase Notif Badge
        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_count') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).css('display','flex');
        });

        $(document).ready(() => loadTab('tv'));
    </script>
</body>
    </html>
