<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Ultimate Pro</title>

    <style>
        :root { --primary: #f07d3a; --bg: #000; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: #121212; color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000000; }
        .modal-box { background: #1a1a1a; width: 85%; max-width: 350px; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid var(--primary); }
        .modal-btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; display: block; width: 100%; text-decoration: none; margin-top: 15px; }

        /* HEADER */
        header { padding: 15px; background: #000; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .pill-logo { background: #d32f2f; color: #fff; padding: 4px 35px; border-radius: 20px; font-weight: 900; font-size: 18px; }
        .notif-icon { position: absolute; right: 20px; font-size: 22px; color: #fff; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: red; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 1px solid #000; }

        /* SLIDER */
        #slider-container { width: 100%; height: 190px; overflow: hidden; position: relative; display: none; margin-bottom: 10px; }
        .slide { width: 100%; height: 100%; position: absolute; display: none; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* GRID */
        .section-title { padding: 15px 15px 5px; font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 12px; }
        .card-info { background: #fff; padding: 6px 0; overflow: hidden; border-top: 1px solid #eee; }
        .marquee-box { white-space: nowrap; display: inline-block; padding-left: 100%; animation: slow-move 10s linear infinite; font-size: 10px; font-weight: 900; color: #000; text-transform: uppercase; }
        @keyframes slow-move { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* SKELETON */
        .skeleton { background: #222; background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%); background-size: 200% 100%; animation: load-skel 1.5s infinite; border-radius: 10px; }
        @keyframes load-skel { to { background-position: -200% 0; } }

        /* PLAYER */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        .p-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transition: 0.4s ease; z-index: 10002; }
        .ui-hide { opacity: 0; pointer-events: none; }
        .p-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 50px; z-index: 10005; pointer-events: none; }
        .p-center i, .play-wrapper { pointer-events: auto; }
        .play-wrapper { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .white-spinner { position: absolute; width: 80px; height: 80px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .play-btn-circle { width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 25px; cursor: pointer; }

        /* FOOTER */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; padding: 10px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; color: #666; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: var(--primary); padding: 6px 25px; border-radius: 20px; margin-top: -5px; color: #fff; }

        .wa-btn { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 999; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="welcome-modal">
        <div class="modal-box">
            <h3 style="color:var(--primary);margin:0;">WASI TV PRO</h3>
            <p style="font-size:13px;color:#bbb;">Join our official WhatsApp group for latest news.</p>
            <a href="https://chat.whatsapp.com/IcYpWwF4WXEEcgjIxXXRM4?s=cl&p=a&ilr=0" target="_blank" class="modal-btn">Join WhatsApp Group</a>
            <button onclick="$('#welcome-modal').fadeOut()" style="background:none;border:none;color:#666;margin-top:10px;cursor:pointer;">Close</button>
            <div style="font-size:10px;color:#444;margin-top:15px;">Developed by Wasi Developer</div>
        </div>
    </div>

    <header>
        <div class="pill-logo">Jazz Tv</div>
        <div class="notif-icon" onclick="goToHash('#notif'); loadTab('notif')">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="slider-container"></div>
    <div id="app-content"></div>

    <a href="https://wa.me/923342002756" class="wa-btn"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- PLAYER -->
    <div id="player-overlay" onclick="togglePlayerUI()">
        <video id="main-video" playsinline></video>
        <div class="p-ui" id="p-controls">
            <div class="p-top" onclick="event.stopPropagation()">
                <div style="display:flex; align-items:center; gap:15px;"><i class="fa-solid fa-arrow-left" onclick="history.back()"></i><span id="v-title" style="font-weight:700;">Loading...</span></div>
                <div style="display:flex; gap:20px;"><i class="fa-solid fa-chromecast"></i><i class="fa-solid fa-lock-open" id="lock-icon" onclick="toggleLock(event)"></i></div>
            </div>
            <div class="p-center" id="ctrl-center">
                <i class="fa-solid fa-backward-step" onclick="event.stopPropagation(); video.currentTime -= 10"></i>
                <div class="play-wrapper" onclick="event.stopPropagation()">
                    <div class="white-spinner" id="p-loader"></div>
                    <div class="play-btn-circle" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></div>
                </div>
                <i class="fa-solid fa-forward-step" onclick="event.stopPropagation(); video.currentTime += 10"></i>
            </div>
            <div class="p-bottom" id="ctrl-bottom" onclick="event.stopPropagation()">
                <input type="range" class="seekbar" id="seekbar" value="0" step="0.1" oninput="manualSeek(this.value)">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-top:5px;"><span id="c-time">00:00</span><span style="color:#ff4444; font-weight:900;">LIVE</span></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="goToHash('#tv'); loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="goToHash('#missing'); loadTab('missing', this)"><i class="fa-solid fa-circle-exclamation"></i>Missing</div>
    </div>

    <script>
        const API_V5 = "https://web.jazztv.pk/alpha/api_gateway/v5/web/";
        const API_V3 = "https://web.jazztv.pk/alpha/api_gateway/v3/web/";
        const PHP_GATEWAY = "https://jazztv.pk/alpha/api_gateway/index.php/media/";
        const SLIDER_API = "https://wasitv.lovable.app/api/public/slider";

        const video = document.getElementById('main-video');
        let hls = new Hls();
        let cachedToken = null;
        let uiTimeout, isLocked = false;

        // Firebase Setup
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- Jazz TV Decryption ---
        function decryptAes(text) {
            if (!text) return null;
            const keyStr = "gTOwkDMjlDZ0EjY58GcsVWM4oGOllnd4VzN3UmZsBHc";
            const reversed = keyStr.split('').reverse().join('');
            const key = atob(reversed);
            const iv = CryptoJS.enc.Utf8.parse("fpmjlrbhpljoennm");
            try {
                const ct = CryptoJS.enc.Hex.parse(text);
                const decrypted = CryptoJS.AES.decrypt({ ciphertext: ct }, CryptoJS.enc.Utf8.parse(key), { iv: iv });
                return JSON.parse(decrypted.toString(CryptoJS.enc.Utf8));
            } catch (e) { return null; }
        }

        // --- Auth Token Generator ---
        async function getAuthToken() {
            if (cachedToken) return cachedToken;
            const deviceId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
                const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
            try {
                const res = await fetch(`${API_V5}auth/guest-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_id: deviceId, platform: "web" })
                });
                const json = await res.json();
                const data = decryptAes(json.eData);
                if (data && data.access_token) {
                    cachedToken = data.access_token;
                    return cachedToken;
                }
            } catch (e) { return ""; }
        }

        // --- Routing ---
        function goToHash(h) { history.pushState(null, '', h); }
        window.onpopstate = () => {
            const h = window.location.hash;
            if (h !== "#player") { $('#player-overlay').fadeOut(); video.pause(); handleRouting(h); }
        };

        function handleRouting(h) {
            if (h === "#tv") loadTab('tv', $('.nav-item')[1]);
            else if (h === "#missing") loadTab('missing', $('.nav-item')[2]);
            else if (h === "#notif") loadTab('notif');
            else loadTab('home', $('.nav-item')[0]);
        }

        // --- UI Logic ---
        async function loadSlider() {
            try {
                const r = await fetch(SLIDER_API).then(res => res.json());
                let html = '';
                r.forEach((s, idx) => { html += `<div class="slide" ${idx===0?'style="display:block"':''}><img src="${s.image}"></div>`; });
                $('#slider-container').html(html).show();
                let current = 0;
                setInterval(() => {
                    const slides = $('.slide');
                    slides.eq(current).fadeOut(500);
                    current = (current + 1) % slides.length;
                    slides.eq(current).fadeIn(500);
                }, 4000);
            } catch(e) { $('#slider-container').hide(); }
        }

        async function loadTab(tab, el) {
            if(el) { $('.nav-item').removeClass('active'); $(el).addClass('active'); }
            $('#app-content').html('<div class="grid">' + '<div class="skeleton" style="aspect-ratio:1/1.2;"></div>'.repeat(9) + '</div>');
            $('#slider-container').hide();

            if (tab === 'home') {
                loadSlider();
                const token = await getAuthToken();
                const res = await fetch(`${API_V5}genre-programs-carousal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ genre_slug: 'live-tv', project_id: "2", platform: "web" })
                }).then(r => r.json());
                const data = decryptAes(res.eData);
                render('Top Channels', data?.data?.programData || []);
            } else if (tab === 'tv') {
                const token = await getAuthToken();
                const res = await fetch(`${API_V3}live-tv`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({ project_id: "2", platform: "web" }),
                }).then(r => r.json());
                const data = decryptAes(res.eData);
                render('Jazz TV Channels', data?.data?.channels || []);
            } else if (tab === 'missing') {
                db.ref('missing_sports').once('value', s => render('Missing Channels', Object.values(s.val() || {}), true));
            } else if (tab === 'notif') {
                loadNotifications();
            }
        }

        function render(title, items, isFirebase = false) {
            let h = `<div class="section-title">${title}</div><div class="grid">`;
            items.forEach(i => {
                const name = i.channelName || i.name || i.title;
                const img = i.logo || i.image || i.portrait_poster;
                const slug = i.channelSlug || i.slug;
                h += `<div class="card" onclick="playStream('${slug}','${name}')">
                    <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="card-info"><div class="marquee-box">${name} &nbsp; • &nbsp; ${name}</div></div>
                </div>`;
            });
            $('#app-content').html(h + '</div>');
        }

        async function playStream(slug, name) {
            goToHash('#player');
            $('#v-title').text(name);
            $('#player-overlay').fadeIn();
            $('#p-loader').show();
            if(window.Android) window.Android.rotateLandscape();

            try {
                const response = await fetch(`${PHP_GATEWAY}get-channel-url`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "slug": slug, "phone_details": navigator.userAgent, "user_id": "0", "mobile": "0" })
                });
                const json = await response.json();
                const data = decryptAes(json.eData);
                const streamUrl = data?.data?.ChannelStreamingUrls || data?.data?.HlsUrl || data?.ChannelStreamingUrls || "";

                if (Hls.isSupported()) {
                    hls.destroy(); hls = new Hls();
                    hls.loadSource(streamUrl); hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else { video.src = streamUrl; video.play(); }
                showControls();
            } catch (e) { alert("Stream not available"); }
        }

        // Player Controls
        function togglePlayerUI() { $('#p-controls').hasClass('ui-hide') ? showControls() : hideControls(); }
        function showControls() { $('#p-controls').removeClass('ui-hide'); clearTimeout(uiTimeout); uiTimeout = setTimeout(hideControls, 4000); }
        function hideControls() { $('#p-controls').addClass('ui-hide'); }
        function togglePlay() { if(!isLocked) { video.paused ? video.play() : video.pause(); showControls(); } }
        function toggleLock(e) {
            e.stopPropagation(); isLocked = !isLocked;
            $('#lock-icon').attr('class', isLocked ? 'fa-solid fa-lock' : 'fa-solid fa-lock-open');
            isLocked ? $('#ctrl-center, #ctrl-bottom').fadeOut() : $('#ctrl-center, #ctrl-bottom').fadeIn();
            showControls();
        }
        function manualSeek(v) { video.currentTime = (v / 100) * video.duration; showControls(); }

        video.onwaiting = () => $('#p-loader').show();
        video.onplaying = () => { $('#p-loader').hide(); $('#play-icon').attr('class', 'fa-solid fa-pause'); setTimeout(hideControls, 3000); };
        video.onpause = () => { $('#play-icon').attr('class', 'fa-solid fa-play'); showControls(); };
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime / video.duration) * 100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#c-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        function loadNotifications() {
            db.ref('app_notifications').once('value', s => {
                const data = s.val() || {};
                localStorage.setItem('sc', Object.keys(data).length); $('#notif-badge').hide();
                let h = '<div class="section-title">Inbox</div>';
                Object.values(data).reverse().forEach(n => {
                    h += `<div style="background:#222;padding:15px;border-radius:10px;margin:10px;border-left:4px solid var(--primary);"><b>${n.title}</b><p style="font-size:12px;color:#888;margin-top:5px;">${n.message}</p></div>`;
                });
                $('#app-content').html(h || '<p style="text-align:center;padding:50px;">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('sc') || 0;
            if(count > seen) $('#notif-badge').text(count-seen).css('display','flex');
        });

        $(document).ready(() => { handleRouting(window.location.hash); $('#welcome-modal').fadeIn(); });
    </script>
</body>
</html>
