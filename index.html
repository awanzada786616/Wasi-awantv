<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Pro Max</title>

    <style>
        :root { --primary: #ff9800; --bg: #000; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        /* SKELETON EFFECT */
        .skeleton { background: #1a1a1a; background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 10px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { width: 100%; aspect-ratio: 1/1; margin-bottom: 10px; }

        /* HOME UI */
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #000; border-bottom: 1px solid #222; }
        .logo { font-weight: 800; color: var(--primary); font-size: 20px; }
        .section-title { padding: 15px; font-size: 14px; font-weight: bold; color: #888; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .card { background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 10px; }
        .card-name { padding: 5px; font-size: 10px; text-align: center; white-space: nowrap; overflow: hidden; }

        /* PLAYER OVERLAY (BLACK SCREEN INITIALLY) */
        #player-container { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; overflow: hidden; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }

        /* TOP CONTROLS */
        .p-top { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 2; }
        .p-top-left { display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: bold; }
        .p-top-right { display: flex; gap: 20px; font-size: 20px; }

        /* CENTER CONTROLS */
        .p-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 60px; z-index: 2; width: 100%; justify-content: center; }
        .p-center i { font-size: 30px; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* BUFFERING SPINNER (ARC STYLE) */
        .spinner { width: 60px; height: 60px; border: 4px solid transparent; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; position: absolute; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* SIDE SLIDERS (AS PER SCREENSHOT) */
        .side-slider { position: absolute; top: 50%; transform: translateY(-50%); width: 4px; height: 150px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; flex-direction: column-reverse; }
        .side-fill { width: 100%; background: var(--primary); border-radius: 10px; position: relative; }
        .side-fill::after { content: ''; position: absolute; top: -5px; left: -3px; width: 10px; height: 10px; background: var(--primary); border-radius: 50%; }
        .left-side { left: 30px; }
        .right-side { right: 30px; }

        /* BOTTOM CONTROLS */
        .p-bottom { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); z-index: 2; }
        .seek-container { display: flex; align-items: center; gap: 15px; font-size: 12px; }
        .seekbar { flex: 1; accent-color: var(--primary); height: 3px; cursor: pointer; }

        /* NAVIGATION & WHATSAPP */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; padding: 10px 0; border-top: 1px solid #222; }
        .nav-item { flex: 1; text-align: center; font-size: 10px; color: #666; }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 3px; }
        .nav-item.active { color: var(--primary); }
        .wa-float { position: fixed; bottom: 80px; right: 20px; background: #25d366; color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; z-index: 1000; }

        .ui-hide { opacity: 0; pointer-events: none; transition: 0.5s; }
        .ui-show { opacity: 1; pointer-events: auto; transition: 0.2s; }
    </style>
</head>
<body>

    <header>
        <div class="logo">WASI TV</div>
        <div id="notif-btn" style="position:relative;"><i class="fa-solid fa-bell"></i></div>
    </header>

    <div id="content-area"></div>

    <a href="https://wa.me/923342002756" class="wa-float"><i class="fa-brands fa-whatsapp"></i></a>

    <div class="bottom-nav">
        <div class="nav-item" onclick="loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="loadTab('trending', this)"><i class="fa-solid fa-fire"></i>Trending</div>
        <div class="nav-item" onclick="loadTab('missing', this)"><i class="fa-solid fa-circle-info"></i>Missing</div>
    </div>

    <!-- PLAYER OVERLAY -->
    <div id="player-container">
        <video id="main-video" playsinline></video>

        <!-- Spinner center -->
        <div class="p-center" style="pointer-events: none;">
            <div class="spinner" id="buffer-spinner"></div>
        </div>

        <div id="player-ui" class="ui-show">
            <!-- Top Bar -->
            <div class="p-top">
                <div class="p-top-left">
                    <i class="fa-solid fa-chevron-left" onclick="closePlayer()"></i>
                    <span id="video-title">Wasi TV Live</span>
                </div>
                <div class="p-top-right">
                    <i class="fa-solid fa-chromecast"></i>
                    <i class="fa-solid fa-lock-open"></i>
                </div>
            </div>

            <!-- Middle Controls -->
            <div class="p-center">
                <i class="fa-solid fa-rotate-left" onclick="seek(-10)"></i>
                <i class="fa-solid fa-play" id="play-pause" onclick="togglePlay()" style="font-size: 50px; margin: 0 40px; opacity: 0;"></i>
                <i class="fa-solid fa-rotate-right" onclick="seek(10)"></i>
            </div>

            <!-- Side Sliders (Visual only as per screenshot) -->
            <div class="side-slider left-side"><div class="side-fill" style="height: 60%;"></div></div>
            <div class="side-slider right-side"><div class="side-fill" style="height: 80%;"></div></div>

            <!-- Bottom Bar -->
            <div class="p-bottom">
                <div class="seek-container">
                    <span id="curr-time">00:00</span>
                    <input type="range" class="seekbar" id="seekbar" value="0" step="0.1" oninput="manualSeek(this.value)">
                    <span id="total-time">00:00</span>
                    <i class="fa-solid fa-expand" style="margin-left:10px;"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        let uiTimeout;

        // Auto Landscape logic
        function setLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(()=> console.log("Orientation lock not supported"));
            } else if (window.Android) {
                window.Android.rotateLandscape();
            }
        }

        function setPortrait() {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            } else if (window.Android) {
                window.Android.rotatePortrait();
            }
        }

        // Load content with Skeletons
        async function loadTab(type, el) {
            $('.nav-item').removeClass('active'); $(el).addClass('active');
            let html = `<div class="section-title">Loading ${type}...</div><div class="grid">`;
            for(let i=0; i<9; i++) html += `<div class="skeleton sk-card"></div>`;
            $('#content-area').html(html + '</div>');

            // Simulate API fetch
            setTimeout(async () => {
                const res = await fetch(`${API}/feed`).then(r => r.json());
                let items = type === 'tv' ? res.channels : res.sports;
                let gridHtml = `<div class="section-title">${type} Channels</div><div class="grid">`;
                items.forEach(item => {
                    gridHtml += `
                    <div class="card" onclick="playStream('${item.slug}', '${item.name || item.channelName}')">
                        <img src="${item.logo || item.image || 'https://via.placeholder.com/150'}">
                        <div class="card-name">${item.name || item.channelName}</div>
                    </div>`;
                });
                $('#content-area').html(gridHtml + '</div>');
            }, 800);
        }

        function playStream(slug, name) {
            $('#video-title').text(name);
            $('#player-container').show();
            setLandscape();
            
            // Show black screen first
            video.src = "";
            $('#buffer-spinner').show();

            let streamUrl = slug.startsWith('http') ? slug : `${API}/stream?slug=${slug}&type=channel`;

            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = streamUrl;
                video.play();
            }
            resetUITimer();
        }

        function closePlayer() {
            video.pause();
            $('#player-container').hide();
            setPortrait();
        }

        // UI Controls logic
        function togglePlay() { video.paused ? video.play() : video.pause(); resetUITimer(); }
        function seek(amount) { video.currentTime += amount; resetUITimer(); }
        function manualSeek(val) { video.currentTime = (val / 100) * video.duration; resetUITimer(); }

        function resetUITimer() {
            $('#player-ui').removeClass('ui-hide').addClass('ui-show');
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                if (!video.paused) $('#player-ui').removeClass('ui-show').addClass('ui-hide');
            }, 3500);
        }

        $('#player-container').on('click touchstart', function(e) {
            if ($(e.target).is('i, input')) return;
            if ($('#player-ui').hasClass('ui-hide')) {
                resetUITimer();
            } else {
                $('#player-ui').removeClass('ui-show').addClass('ui-hide');
            }
        });

        // Video Events
        video.onwaiting = () => $('#buffer-spinner').show();
        video.onplaying = () => { 
            $('#buffer-spinner').hide(); 
            $('#play-pause').attr('class', 'fa-solid fa-pause');
            resetUITimer(); // Hide UI after play starts
        };
        video.onpause = () => {
            $('#play-pause').attr('class', 'fa-solid fa-play').css('opacity', '1');
            $('#player-ui').removeClass('ui-hide').addClass('ui-show');
        };
        video.ontimeupdate = () => {
            let cur = video.currentTime, dur = video.duration || 0;
            $('#seekbar').val((cur / dur) * 100 || 0);
            $('#curr-time').text(formatTime(cur));
            $('#total-time').text(formatTime(dur));
        };

        function formatTime(s) {
            let m = Math.floor(s / 60);
            s = Math.floor(s % 60);
            return (m < 10 ? '0' : '') + m + ":" + (s < 10 ? '0' : '') + s;
        }

        $(document).ready(() => loadTab('tv', $('.nav-item')[1]));
    </script>
</body>
</html>
