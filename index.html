<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Pro</title>

    <style>
        :root { --primary: #ff4747; --bg: #1a1a1a; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; text-decoration: none; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 100px; }

        /* JAZZ TV STYLE HEADER */
        header { padding: 15px; text-align: center; background: #1a1a1a; position: sticky; top: 0; z-index: 1000; }
        .pill-title { background: var(--primary); color: #fff; padding: 5px 25px; border-radius: 20px; font-weight: bold; font-size: 18px; display: inline-block; box-shadow: 0 4px 10px rgba(255, 71, 71, 0.4); }

        /* GRID LIKE SCREENSHOT */
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; text-align: center; border: 1px solid #333; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        
        /* MOVING TEXT (MARQUEE) */
        .card-info { background: #fff; padding: 8px 5px; overflow: hidden; white-space: nowrap; position: relative; }
        .card-title { display: inline-block; font-size: 11px; font-weight: bold; color: #000; min-width: 100%; animation: marquee 5s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* SECTION TITLES */
        .section-title { padding: 10px 15px 0; font-size: 12px; font-weight: bold; color: #888; text-transform: uppercase; }

        /* IMPROVED PLAYER UI */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #main-video { width: 100%; height: 100%; }
        .player-controls { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; opacity: 1; transition: 0.3s; }
        .ui-hidden { opacity: 0; pointer-events: none; }

        /* SPINNER */
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* FOOTER LIKE SCREENSHOT */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; display: flex; padding: 10px 0; border-top: 1px solid #333; z-index: 2000; }
        .nav-item { color: #fff; text-align: center; flex: 1; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: #f07d3a; color: #fff; padding: 8px 25px; border-radius: 25px; margin-top: -5px; }

        .notif-card { background: #222; padding: 15px; border-radius: 10px; margin: 10px; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="pill-title">Wasi TV</div>
    </header>

    <div id="main-content"></div>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay" onclick="toggleUI()">
        <div id="loader"></div>
        <video id="main-video" playsinline></video>
        <div class="player-controls" id="p-ui">
            <div style="display:flex; align-items:center; gap:20px;">
                <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size:25px; color:#fff;"></i>
                <span id="p-title" style="font-weight:bold; font-size:18px;">Wasi TV Live</span>
            </div>
            <div style="align-self:center;">
                <i class="fa-solid fa-play" id="play-btn" style="font-size:60px; color:var(--primary);" onclick="event.stopPropagation(); togglePlay()"></i>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="dur">LIVE</span>
                <i class="fa-solid fa-expand" onclick="event.stopPropagation(); goFull()" style="font-size:20px;"></i>
            </div>
        </div>
    </div>

    <!-- FOOTER (SCREENSHOT STYLE) -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="goToHash('#tv'); loadTV(this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="goToHash('#movies'); loadMovies(this)"><i class="fa-solid fa-clapperboard"></i>Movies</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function goToHash(h) { history.pushState(null, '', h); }

        window.onpopstate = function() {
            const h = window.location.hash;
            if (h === "" || h === "#home") { closePlayer(); loadTab('home'); }
            else if (h === "#tv") loadTV();
            else if (h === "#movies") loadMovies();
        };

        async function loadTab(tab, el) {
            updateNav(el);
            $('#main-content').html('<div class="section-title">Home Section</div>');
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            renderSection('Live Free Sports', r.sports);
            // Missing Section
            db.ref('missing_sports').once('value', s => {
                $('#main-content').append('<div class="section-title">Missing Sports</div><div id="missing-grid" class="playlist-grid"></div>');
                renderIn('missing-grid', Object.values(s.val() || {}));
            });
        }

        async function loadTV(el) {
            updateNav(el);
            $('#main-content').html('<div class="section-title">All Channels</div>');
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            renderSection('Live TV', r.channels);
        }

        async function loadMovies(el) {
            updateNav(el);
            $('#main-content').html('<div class="section-title">Trending Movies</div>');
            const r = await fetch(`${API}/movies`).then(r=>r.json());
            r.forEach(sec => renderSection(sec.title, sec.items));
        }

        function updateNav(el) {
            if(!el) return;
            $('.nav-item').removeClass('active');
            $(el).addClass('active');
        }

        function renderSection(title, items) {
            if(!items) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const name = i.name || i.channelName || "Wasi TV";
                const img = i.image || i.logo;
                html += `<div class="card" onclick="playStream('${i.slug}','${i.type||'channel'}','${name}')">
                    <img src="${img}" loading="lazy">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        function renderIn(id, items) {
            let html = '';
            items.forEach(i => {
                const name = i.channelName || i.name;
                html += `<div class="card" onclick="playStream('${i.slug}','channel','${name}')">
                    <img src="${i.logo}" loading="lazy">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            $('#' + id).html(html);
        }

        function playStream(slug, type, name) {
            goToHash('#player');
            if(window.Android) window.Android.rotateLandscape();
            $('#p-title').text(name);
            $('#player-overlay').show();
            $('#loader').show();
            let url = slug.startsWith('http') ? slug : API + "/stream?slug=" + slug + "&type=" + type;
            if (Hls.isSupported()) { hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
            else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').hide(); if(window.Android) window.Android.rotatePortrait(); }
        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function toggleUI() { $('#p-ui').toggleClass('ui-hidden'); }
        
        video.onwaiting = () => $('#loader').show();
        video.onplaying = () => { $('#loader').hide(); $('#play-btn').attr('class', 'fa-solid fa-pause'); };
        video.onpause = () => $('#play-btn').attr('class', 'fa-solid fa-play');

        $(document).ready(() => loadTV($('.nav-item')[1]));
    </script>
</body>
</html>
