<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Pro Max</title>

    <style>
        :root { --primary: #ff9800; --bg: #0b0b0b; --card-bg: #1a1a1a; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; text-decoration: none !important; }
        
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 100px; overflow-x: hidden; }

        /* HEADER */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; backdrop-filter: blur(10px); }
        .logo-text { font-weight: 800; font-size: 20px; color: var(--primary); letter-spacing: 1px; }

        /* NOTIFICATION */
        .notif-btn { position: relative; font-size: 22px; color: #fff; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: #ff0000; color: #fff; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; }

        /* SKELETON EFFECT */
        .skeleton { background: #222; background: linear-gradient(110deg, #222 8%, #333 18%, #222 33%); border-radius: 12px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
        @keyframes shine { to { background-position-x: -200%; } }
        .sk-card { width: 100%; aspect-ratio: 1/1.2; border-radius: 15px; }

        /* GRID */
        .section-title { padding: 20px 15px 10px; font-size: 14px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px; }
        
        /* MODERN CARDS */
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; position: relative; transition: 0.3s; border: 1px solid #333; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 15px; background: #fff; }
        .card-info { padding: 8px; background: var(--card-bg); overflow: hidden; white-space: nowrap; }
        .card-title { font-size: 10px; font-weight: 600; color: #fff; text-align: center; }

        /* PLAYER OVERLAY */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #main-video { width: 100%; height: 100%; }
        
        /* SPINNER OVER PLAY BUTTON */
        .p-center-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; }
        #p-loader { position: absolute; width: 90px; height: 90px; border: 4px solid transparent; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transition: 0.4s; z-index: 10; }
        .ui-hidden { opacity: 0; pointer-events: none; }

        .p-center-btns { display: flex; align-items: center; justify-content: center; gap: 40px; }
        .p-center-btns i { font-size: 35px; color: #fff; cursor: pointer; }
        #play-btn { font-size: 60px; color: #fff; z-index: 11; }

        /* VOLUME INDICATOR CENTER */
        #vol-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 10px; display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 100; pointer-events: none; }
        #vol-indicator i { font-size: 30px; color: var(--primary); }

        .p-bottom-bar { width: 100%; }
        .seekbar { width: 100%; height: 4px; accent-color: var(--primary); cursor: pointer; margin-bottom: 8px; }
        .time-info { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #fff; }

        /* FOOTER */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; padding: 10px 0; border-top: 1px solid #222; z-index: 2000; }
        .nav-item { color: #666; text-align: center; flex: 1; font-size: 10px; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { color: var(--primary); }

        /* WHATSAPP FIXED */
        .wa-float { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 1500; }

        .notif-card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin: 10px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">WASI TV <span style="color:#fff; font-size:12px; font-weight:400;">PRO</span></div>
        <div class="notif-btn" onclick="loadTab('notif')">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="main-content"></div>

    <!-- WHATSAPP FAB (Fixed Position) -->
    <a href="https://wa.me/923342002756" class="wa-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay">
        <div id="vol-indicator">
            <i class="fa-solid fa-volume-high"></i>
            <span id="vol-level">100%</span>
        </div>
        
        <video id="main-video" playsinline onclick="toggleUI()"></video>
        
        <div class="player-ui" id="p-controls">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fa-solid fa-arrow-left" onclick="closePlayer()" style="font-size:24px;"></i>
                <span id="p-title" style="font-size:16px; font-weight:700;">Loading...</span>
            </div>
            
            <div class="p-center-btns">
                <i class="fa-solid fa-backward-10" onclick="video.currentTime -= 10"></i>
                <div class="p-center-wrapper">
                    <div id="p-loader"></div>
                    <i class="fa-solid fa-play" id="play-btn" onclick="togglePlay()"></i>
                </div>
                <i class="fa-solid fa-forward-10" onclick="video.currentTime += 10"></i>
            </div>

            <div class="p-bottom-bar">
                <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="manualSeek(this.value)">
                <div class="time-info">
                    <span id="cur-time">00:00</span>
                    <span style="color:var(--primary);"><i class="fa-solid fa-circle-dot"></i> LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="loadTV(this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="loadTrending(this)"><i class="fa-solid fa-bolt"></i>Trending</div>
        <div class="nav-item" onclick="loadTab('missing', this)"><i class="fa-solid fa-circle-question"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- SKELETON RENDERER ---
        function showSkeletons(title) {
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            for(let i=0; i<9; i++) { html += `<div class="skeleton sk-card"></div>`; }
            $('#main-content').html(html + '</div>');
        }

        async function loadTab(tab, el) {
            if(el) { $('.nav-item').removeClass('active'); $(el).addClass('active'); }
            if(tab === 'home') {
                showSkeletons('Featured Sports');
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderSection('Featured Sports', r.sports, true);
            } else if(tab === 'missing') {
                showSkeletons('Missing Channels');
                db.ref('missing_sports').once('value', s => renderSection('Missing Channels', Object.values(s.val() || {}), true));
            } else if(tab === 'notif') {
                $('#main-content').html('<div class="section-title">Notifications</div><div id="notif-list"></div>');
                loadInbox();
            }
        }

        async function loadTV(el) {
            $('.nav-item').removeClass('active'); $(el).addClass('active');
            showSkeletons('All Channels');
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            renderSection('All Channels', r.channels, true);
        }

        async function loadTrending(el) {
            $('.nav-item').removeClass('active'); $(el).addClass('active');
            $('#main-content').html('');
            const r = await fetch(`${API}/movies`).then(r=>r.json());
            r.forEach(sec => renderSection(sec.title, sec.items, false));
        }

        function renderSection(title, items, clear) {
            if(!items) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const name = i.name || i.channelName || "Unknown";
                const img = i.image || i.logo || "https://via.placeholder.com/150";
                html += `<div class="card" onclick="playStream('${i.slug}','${i.type||'channel'}','${name}')">
                    <img src="${img}">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            if(clear) $('#main-content').html(html + '</div>');
            else $('#main-content').append(html + '</div>');
        }

        // --- PLAYER LOGIC ---
        function playStream(slug, type, name) {
            $('#p-title').text(name);
            $('#player-overlay').fadeIn();
            $('#p-loader').show();
            let url = slug.startsWith('http') ? slug : API + "/stream?slug=" + slug + "&type=" + type;
            if (Hls.isSupported()) { hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
            else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').fadeOut(); }
        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function toggleUI() { $('#p-controls').toggleClass('ui-hidden'); }
        function manualSeek(v) { video.currentTime = (v / 100) * video.duration; }

        video.onwaiting = () => $('#p-loader').show();
        video.onplaying = () => { $('#p-loader').hide(); $('#play-btn').attr('class', 'fa-solid fa-pause'); };
        video.onpause = () => $('#play-btn').attr('class', 'fa-solid fa-play');
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime / video.duration) * 100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#cur-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        // --- VOLUME SWIPE LOGIC ---
        let touchStartY = 0;
        let startVol = 1;
        const playerOverlay = document.getElementById('player-overlay');

        playerOverlay.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            startVol = video.volume;
        });

        playerOverlay.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let touchMoveY = e.touches[0].clientY;
            let deltaY = touchStartY - touchMoveY;
            let sensitivity = 200; // Adjust for faster/slower scroll
            let newVol = startVol + (deltaY / sensitivity);
            
            if(newVol > 1) newVol = 1;
            if(newVol < 0) newVol = 0;
            
            video.volume = newVol;
            showVolumeIndicator(Math.round(newVol * 100));
        });

        playerOverlay.addEventListener('touchend', () => {
            setTimeout(() => { $('#vol-indicator').fadeOut(); }, 800);
        });

        function showVolumeIndicator(val) {
            $('#vol-level').text(val + "%");
            $('#vol-indicator').css('display', 'flex');
            const icon = val === 0 ? 'fa-volume-mute' : (val < 50 ? 'fa-volume-low' : 'fa-volume-high');
            $('#vol-indicator i').attr('class', 'fa-solid ' + icon);
        }

        function loadInbox() {
            db.ref('app_notifications').once('value', s => {
                localStorage.setItem('seen_notif', Object.keys(s.val() || {}).length);
                $('#notif-badge').hide();
                let html = Object.values(s.val() || {}).reverse().map(n => `<div class="notif-card"><h4>${n.title}</h4><p style="font-size:12px;color:#999">${n.message}</p></div>`).join('');
                $('#notif-list').html(html || '<p style="text-align:center;color:#555">No notifications</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_notif') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).css('display','flex');
        });

        $(document).ready(() => loadTV($('.nav-item')[1]));
    </script>
</body>
</html>
