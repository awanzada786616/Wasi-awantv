<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Pro</title>

    <style>
        :root { --primary: #f07d3a; --bg: #1a1a1a; --header-red: #d32f2f; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* JAZZ TV STYLE HEADER */
        header { padding: 15px; text-align: center; background: #1a1a1a; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .pill-logo { background: var(--header-red); color: #fff; padding: 5px 40px; border-radius: 20px; font-weight: 800; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .notif-btn { position: absolute; right: 20px; color: #fff; font-size: 22px; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: red; color: #fff; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid #1a1a1a; }

        /* SKELETON EFFECT */
        .skeleton { background: #333; background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 12px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* GRID & CARDS (EXACT JAZZ TV STYLE) */
        .section-title { padding: 15px 15px 5px; font-size: 12px; font-weight: 700; color: #aaa; text-transform: uppercase; }
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
        
        .card { background: #fff; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #333; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #eee; }
        .card-name { background: #fff; color: #000; padding: 6px 4px; font-size: 10px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid #ddd; }

        /* PROFESSIONAL PLAYER */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #main-video { width: 100%; height: 100%; }
        
        /* Arc Spinner exactly in center */
        .spinner { width: 60px; height: 60px; border: 4px solid transparent; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 25px; transition: 0.5s; }
        .ui-hide { opacity: 0; pointer-events: none; }

        .p-center { display: flex; align-items: center; justify-content: center; gap: 50px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
        .p-center i { font-size: 35px; color: #fff; cursor: pointer; }
        
        .p-bottom-bar { width: 100%; position: absolute; bottom: 20px; left: 0; padding: 0 20px; }
        .seekbar { width: 100%; height: 4px; accent-color: var(--primary); cursor: pointer; }

        /* FOOTER (ACTIVE ICON PILL) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; padding: 12px 0; border-top: 1px solid #222; z-index: 2000; }
        .nav-item { color: #888; text-align: center; flex: 1; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: var(--primary); color: #fff; padding: 6px 25px; border-radius: 20px; margin-top: -5px; }

        /* WHATSAPP FIXED */
        .wa-float { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); z-index: 1500; }

        .notif-card { background: #222; padding: 15px; border-radius: 12px; margin: 12px; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="pill-logo">Jazz Tv</div>
        <div class="notif-btn" onclick="loadTab('notif')">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="main-content"></div>

    <a href="https://wa.me/923342002756" class="wa-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- PLAYER -->
    <div id="player-overlay">
        <div class="spinner" id="p-loader"></div>
        <video id="main-video" playsinline onclick="toggleUI()"></video>
        <div class="player-ui" id="p-controls">
            <div style="display:flex; align-items:center; gap:20px;">
                <i class="fa-solid fa-chevron-left" onclick="closePlayer()" style="font-size:25px;"></i>
                <span id="p-title" style="font-size:16px; font-weight:800; color:var(--primary);">Loading...</span>
            </div>
            
            <div class="p-center">
                <i class="fa-solid fa-rotate-left" onclick="video.currentTime -= 10"></i>
                <i class="fa-solid fa-play" id="play-btn" onclick="togglePlay()" style="font-size:60px;"></i>
                <i class="fa-solid fa-rotate-right" onclick="video.currentTime += 10"></i>
            </div>

            <div class="p-bottom-bar">
                <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="manualSeek(this.value)">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-top:5px;">
                    <span id="cur-time">00:00</span>
                    <span style="color:red;"><i class="fa-solid fa-circle" style="font-size:8px;"></i> LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="loadTab('trending', this)"><i class="fa-solid fa-fire"></i>Movies</div>
        <div class="nav-item" onclick="loadTab('missing', this)"><i class="fa-solid fa-circle-exclamation"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showSkeletons() {
            let h = '<div class="playlist-grid">';
            for(let i=0; i<9; i++) h += '<div class="skeleton" style="aspect-ratio:1/1.3;"></div>';
            $('#main-content').html(h + '</div>');
        }

        async function loadTab(tab, el) {
            if(el) { $('.nav-item').removeClass('active'); $(el).addClass('active'); }
            showSkeletons();

            if(tab === 'home') {
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderGrid('Featured', r.sports);
            } 
            else if(tab === 'tv') {
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderGrid('Live TV Channels', r.channels);
            }
            else if(tab === 'trending') {
                const r = await fetch(`${API}/movies`).then(r=>r.json());
                let html = '';
                r.forEach(s => {
                    html += `<div class="section-title">${s.title}</div><div class="playlist-grid">`;
                    s.items.forEach(i => html += createCard(i));
                    html += '</div>';
                });
                $('#main-content').html(html);
            }
            else if(tab === 'missing') {
                db.ref('missing_sports').once('value', s => {
                    renderGrid('Missing Channels', Object.values(s.val() || {}));
                });
            }
            else if(tab === 'notif') {
                loadInbox();
            }
        }

        function createCard(i) {
            const name = i.name || i.channelName || "Channel";
            const img = i.logo || i.image || "https://via.placeholder.com/150";
            return `<div class="card" onclick="playStream('${i.slug}','${name}')">
                <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                <div class="card-name">${name}</div>
            </div>`;
        }

        function renderGrid(title, items) {
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => html += createCard(i));
            $('#main-content').html(html + '</div>');
        }

        // PLAYER LOGIC
        function playStream(slug, name) {
            if(window.Android) window.Android.rotateLandscape();
            $('#p-title').text(name);
            $('#player-overlay').fadeIn();
            $('#p-loader').show();
            let url = slug.startsWith('http') ? slug : API + "/stream?slug=" + slug + "&type=channel";
            if (Hls.isSupported()) { hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
            else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').fadeOut(); if(window.Android) window.Android.rotatePortrait(); }
        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function toggleUI() { $('#p-controls').toggleClass('ui-hide'); }
        function manualSeek(v) { video.currentTime = (v / 100) * video.duration; }

        video.onwaiting = () => $('#p-loader').show();
        video.onplaying = () => { $('#p-loader').hide(); $('#play-btn').attr('class', 'fa-solid fa-pause'); setTimeout(()=> $('#p-controls').addClass('ui-hide'), 3000); };
        video.onpause = () => { $('#play-btn').attr('class', 'fa-solid fa-play'); $('#p-controls').removeClass('ui-hide'); };
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime / video.duration) * 100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#cur-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        // NOTIFICATIONS
        function loadInbox() {
            db.ref('app_notifications').once('value', s => {
                const data = s.val() || {};
                localStorage.setItem('seen_notif', Object.keys(data).length);
                $('#notif-badge').hide();
                let html = '<div class="section-title">Inbox</div>';
                Object.values(data).reverse().map(n => {
                    html += `<div class="notif-card"><h4>${n.title}</h4><p style="font-size:12px;color:#bbb">${n.message}</p></div>`;
                });
                $('#main-content').html(html || '<p style="padding:20px;color:#555">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_notif') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).css('display','flex');
        });

        $(document).ready(() => loadTab('tv'));
    </script>
</body>
</html>
