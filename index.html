<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Pro</title>

    <style>
        :root { --primary: #ff4747; --bg: #000000; --card-bg: #1a1a1a; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; text-decoration: none !important; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 100px; overflow-x: hidden; }

        header { padding: 15px; text-align: center; background: #000; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .pill-title { background: var(--primary); color: #fff; padding: 5px 25px; border-radius: 20px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 10px rgba(255, 71, 71, 0.3); }

        .notif-btn { position: relative; color: var(--primary); font-size: 22px; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: red; color: #fff; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid #000; }

        /* GRID & CARDS */
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; position: relative; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 8px; display: block; }
        
        /* MARQUEE TEXT */
        .card-info { background: #1a1a1a; padding: 8px 5px; overflow: hidden; white-space: nowrap; }
        .card-title { display: inline-block; font-size: 10px; font-weight: bold; color: #fff; padding-left: 100%; animation: marquee 6s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .section-title { padding: 20px 15px 5px; font-size: 12px; font-weight: bold; color: #555; text-transform: uppercase; letter-spacing: 1px; }

        /* PLAYER & SPINNER */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .p-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transition: 0.3s; }
        .ui-hidden { opacity: 0; pointer-events: none; }

        /* FOOTER NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; padding: 12px 0; border-top: 1px solid #222; z-index: 2000; }
        .nav-item { color: #555; text-align: center; flex: 1; font-size: 10px; font-weight: bold; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); }

        .notif-card { background: #111; padding: 15px; border-radius: 10px; margin: 10px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <div class="pill-title">WASI TV</div>
        <div class="notif-btn" onclick="goToHash('#notif'); loadTab('notif', this)">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="slider-container" style="display:none; width:94%; margin:15px auto; border-radius:15px; overflow:hidden; aspect-ratio:16/9;"></div>
    <div id="main-content"></div>

    <!-- PLAYER -->
    <div id="player-overlay" onclick="toggleUI()">
        <div id="loader"></div>
        <video id="main-video" playsinline></video>
        <div class="p-ui" id="p-controls">
            <div><i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size:25px; color:#fff;"></i></div>
            <div style="align-self:center;"><i class="fa-solid fa-play" id="play-btn" style="font-size:50px; color:var(--primary);" onclick="event.stopPropagation(); togglePlay()"></i></div>
            <div style="text-align:right;"><i class="fa-solid fa-expand" style="font-size:20px; color:#fff;"></i></div>
        </div>
    </div>

    <!-- FOOTER NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="goToHash('#tv'); loadTV(this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="goToHash('#trending'); loadTrending(this)"><i class="fa-solid fa-fire"></i>Trending</div>
        <div class="nav-item" onclick="goToHash('#missing'); loadTab('missing', this)"><i class="fa-solid fa-circle-question"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function goToHash(h) { history.pushState(null, '', h); }

        window.onpopstate = function() {
            const h = window.location.hash;
            if (h === "" || h === "#home") { closePlayer(); loadTab('home', $('.nav-item').first()); }
            else if (h === "#tv") loadTV();
            else if (h === "#trending") loadTrending();
            else if (h === "#missing") loadTab('missing');
            else if (h === "#notif") loadTab('notif');
        };

        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content').html(''); $('#slider-container').hide();
            
            if(tab === 'home') {
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderSection('Live Sports', r.sports);
            } else if(tab === 'missing') {
                $('#main-content').append('<div class="section-title">Missing Sports</div><div id="missing-grid" class="playlist-grid"></div>');
                db.ref('missing_sports').once('value', s => renderIn('missing-grid', Object.values(s.val() || {})));
            } else if(tab === 'notif') {
                $('#main-content').append('<div style="padding:15px;"><div class="section-title">Notifications</div><div id="notif-list"></div></div>');
                loadInbox();
            }
        }

        async function loadTV(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content').html('');
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            renderSection('All Channels', r.channels);
        }

        async function loadTrending(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content').html('');
            const r = await fetch(`${API}/movies`).then(r=>r.json());
            r.forEach(sec => renderSection(sec.title, sec.items));
        }

        function renderSection(title, items) {
            if(!items) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const name = i.name || i.channelName || "Wasi TV";
                html += `<div class="card" onclick="playStream('${i.slug}','${i.type||'channel'}','${name}')">
                    <img src="${i.image || i.logo}" loading="lazy">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        function renderIn(id, items) {
            let html = '';
            items.forEach(i => {
                const name = i.channelName || i.name;
                html += `<div class="card" onclick="playStream('${i.slug}','channel','${name}')">
                    <img src="${i.logo}" loading="lazy">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            $('#' + id).html(html);
        }

        function playStream(slug, type, name) {
            goToHash('#player');
            if(window.Android) window.Android.rotateLandscape();
            $('#player-overlay').show(); $('#loader').show();
            let url = slug.startsWith('http') ? slug : API + "/stream?slug=" + slug + "&type=" + type;
            if (Hls.isSupported()) { hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
            else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').hide(); if(window.Android) window.Android.rotatePortrait(); }
        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function toggleUI() { $('#p-controls').toggleClass('ui-hidden'); }
        
        video.onwaiting = () => $('#loader').show();
        video.onplaying = () => { $('#loader').hide(); $('#play-btn').attr('class', 'fa-solid fa-pause'); };
        video.onpause = () => $('#play-btn').attr('class', 'fa-solid fa-play');

        function loadInbox() {
            db.ref('app_notifications').once('value', s => {
                localStorage.setItem('seen_notif', Object.keys(s.val() || {}).length);
                $('#notif-badge').hide();
                let html = Object.values(s.val() || {}).reverse().map(n => `<div class="notif-card"><h3>${n.title}</h3><p>${n.message}</p></div>`).join('');
                $('#notif-list').html(html || '<p style="color:#555">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_notif') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).css('display','flex');
        });

        $(document).ready(() => loadTab('home', $('.nav-item').first()));
    </script>
</body>
</html>
