
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Ultimate Pro</title>

    <style>
        :root { --primary: #ff9800; --bg: #000000; --card-bg: #ffffff; --text: #000000; --footer-bg: #1a1a1a; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; text-decoration: none !important; }
        
        body { margin: 0; background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* HEADER */
        header { padding: 15px; text-align: center; background: #000; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .pill-title { background: var(--primary); color: #fff; padding: 6px 30px; border-radius: 25px; font-weight: 800; font-size: 18px; letter-spacing: 1px; }

        /* NOTIFICATION */
        .notif-btn { position: relative; color: var(--primary); font-size: 24px; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: red; color: #fff; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid #000; }

        /* GRID & PREMIUM CARDS */
        .section-title { padding: 25px 15px 5px; font-size: 13px; font-weight: 700; color: #777; text-transform: uppercase; letter-spacing: 1.5px; }
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
        .card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 10px; display: block; background: #fff; }
        
        /* MOVING MARQUEE TEXT */
        .card-info { background: #fff; padding: 8px 5px; overflow: hidden; white-space: nowrap; border-top: 1px solid #eee; }
        .card-title { display: inline-block; font-size: 10px; font-weight: 800; color: #000; padding-left: 100%; animation: marquee 8s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* PROFESSIONAL PLAYER UI */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #main-video { width: 100%; height: 100%; }
        
        #p-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; z-index: 100000; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 25px; transition: 0.4s; z-index: 100001; }
        .ui-hidden { opacity: 0; pointer-events: none; }

        .p-center-btns { display: flex; align-items: center; justify-content: center; gap: 50px; }
        .p-center-btns i { font-size: 40px; color: #fff; text-shadow: 0 0 20px rgba(0,0,0,0.8); cursor: pointer; }
        #play-btn { font-size: 70px; color: var(--primary); }

        .p-bottom-bar { width: 100%; }
        .seekbar { width: 100%; height: 5px; accent-color: var(--primary); cursor: pointer; margin-bottom: 10px; }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }

        /* FOOTER (JAZZ TV STYLE) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-bg); display: flex; padding: 12px 0; border-top: 1px solid #333; z-index: 2000; box-shadow: 0 -5px 25px rgba(0,0,0,0.8); }
        .nav-item { color: #888; text-align: center; flex: 1; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; gap: 5px; transition: 0.3s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: #f07d3a; color: #fff; padding: 8px 25px; border-radius: 30px; margin-top: -8px; box-shadow: 0 4px 15px rgba(240, 125, 58, 0.4); }

        /* WHATSAPP BUTTON */
        .wa-float { position: fixed; bottom: 100px; right: 20px; background: #25d366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); z-index: 1500; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .notif-card { background: #111; padding: 15px; border-radius: 12px; margin: 12px; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <div class="pill-title">WASI TV</div>
        <div class="notif-btn" onclick="goToHash('#notif'); loadTab('notif', this)">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="main-content"></div>

    <!-- WHATSAPP FAB -->
    <a href="https://wa.me/923342002756" class="wa-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay" onclick="toggleUI()">
        <div id="p-loader"></div>
        <video id="main-video" playsinline></video>
        <div class="player-ui" id="p-controls">
            <div style="display:flex; align-items:center; gap:20px;">
                <i class="fa-solid fa-chevron-left" onclick="history.back()" style="font-size:30px; color:#fff;"></i>
                <span id="p-title" style="font-size:18px; font-weight:800; color:var(--primary);">Wasi TV Live</span>
            </div>
            
            <div class="p-center-btns">
                <i class="fa-solid fa-backward-step" onclick="event.stopPropagation(); video.currentTime -= 10"></i>
                <i class="fa-solid fa-play" id="play-btn" onclick="event.stopPropagation(); togglePlay()"></i>
                <i class="fa-solid fa-forward-step" onclick="event.stopPropagation(); video.currentTime += 10"></i>
            </div>

            <div class="p-bottom-bar" onclick="event.stopPropagation()">
                <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="manualSeek(this.value)">
                <div class="time-info">
                    <span id="cur-time">00:00</span>
                    <span style="color:red; letter-spacing:1px;"><i class="fa-solid fa-circle" style="font-size:8px; vertical-align:middle;"></i> LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="goToHash('#tv'); loadTV(this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="goToHash('#trending'); loadTrending(this)"><i class="fa-solid fa-fire-flame-curved"></i>Trending</div>
        <div class="nav-item" onclick="goToHash('#missing'); loadTab('missing', this)"><i class="fa-solid fa-circle-exclamation"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function goToHash(h) { history.pushState(null, '', h); }

        window.onpopstate = function() {
            const h = window.location.hash;
            if (h === "" || h === "#home") { closePlayer(); loadTab('home', $('.nav-item').first()); }
            else if (h === "#tv") loadTV();
            else if (h === "#trending") loadTrending();
            else if (h === "#missing") loadTab('missing');
            else if (h === "#notif") loadTab('notif');
        };

        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content').html('');
            
            if(tab === 'home') {
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderSection('Featured Sports', r.sports);
            } else if(tab === 'missing') {
                $('#main-content').append('<div class="section-title">Missing Channels</div><div id="missing-grid" class="playlist-grid"></div>');
                db.ref('missing_sports').once('value', s => renderIn('missing-grid', Object.values(s.val() || {})));
            } else if(tab === 'notif') {
                $('#main-content').append('<div style="padding:15px;"><div class="section-title">Inbox</div><div id="notif-list"></div></div>');
                loadInbox();
            }
        }

        async function loadTV(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content').html('');
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            renderSection('All Live TV', r.channels);
        }

        async function loadTrending(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content').html('');
            const r = await fetch(`${API}/movies`).then(r=>r.json());
            r.forEach(sec => renderSection(sec.title, sec.items));
        }

        function renderSection(title, items) {
            if(!items) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const name = i.name || i.channelName || "Unknown Channel";
                const img = i.image || i.logo || "https://via.placeholder.com/150";
                html += `<div class="card" onclick="playStream('${i.slug}','${i.type||'channel'}','${name}')">
                    <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        function renderIn(id, items) {
            let html = '';
            items.forEach(i => {
                const name = i.channelName || i.name || "Unknown";
                const img = i.logo || i.image || "https://via.placeholder.com/150";
                html += `<div class="card" onclick="playStream('${i.slug}','channel','${name}')">
                    <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="card-info"><div class="card-title">${name}</div></div>
                </div>`;
            });
            $('#' + id).html(html);
        }

        // --- PLAYER LOGIC ---
        function playStream(slug, type, name) {
            goToHash('#player');
            if(window.Android) window.Android.rotateLandscape();
            $('#p-title').text(name);
            $('#player-overlay').show();
            $('#p-loader').show();
            let url = slug.startsWith('http') ? slug : API + "/stream?slug=" + slug + "&type=" + type;
            if (Hls.isSupported()) { hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
            else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').hide(); if(window.Android) window.Android.rotatePortrait(); }
        function togglePlay() { video.paused ? video.play() : video.pause(); }
        function toggleUI() { $('#p-controls').toggleClass('ui-hidden'); }
        function manualSeek(v) { video.currentTime = (v / 100) * video.duration; }

        video.onwaiting = () => $('#p-loader').show();
        video.onplaying = () => { $('#p-loader').hide(); $('#play-btn').attr('class', 'fa-solid fa-pause'); };
        video.onpause = () => $('#play-btn').attr('class', 'fa-solid fa-play');
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime / video.duration) * 100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#cur-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        function loadInbox() {
            db.ref('app_notifications').once('value', s => {
                localStorage.setItem('seen_notif', Object.keys(s.val() || {}).length);
                $('#notif-badge').hide();
                let html = Object.values(s.val() || {}).reverse().map(n => `<div class="notif-card"><h3>${n.title}</h3><p>${n.message}</p></div>`).join('');
                $('#notif-list').html(html || '<p style="color:#555">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_notif') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).css('display','flex');
        });

        $(document).ready(() => loadTV($('.nav-item')[1]));
    </script>
</body>
</html>
