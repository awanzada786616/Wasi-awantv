<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Pro Black</title>

    <style>
        :root { --primary: #ff9800; --bg: #000000; --card-bg: #121212; --border: #1f1f1f; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

        header { padding: 15px; text-align: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 900; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary); font-size: 22px; margin: 0; font-weight: 800; }

        .notif-btn { position: relative; cursor: pointer; color: var(--primary); font-size: 22px; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: #ff3b30; color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid var(--bg); }

        #slider-container { width: 94%; aspect-ratio: 16/9; margin: 15px auto; border-radius: 15px; overflow: hidden; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        .section-title { padding: 20px 15px 5px; font-size: 14px; font-weight: 600; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; text-align: center; position: relative; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 10px; }
        .card.portrait img { aspect-ratio: 2/3; object-fit: cover; padding: 0; }
        .card-title { font-size: 10px; font-weight: 600; color: #eee; padding: 8px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* PLAYER LANDSCAPE FIX */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: top left; margin-left: 100vw; }
        #main-video { width: 100%; height: 100%; }

        /* FOOTER NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0a0a0a; display: flex; padding: 12px 0; border-top: 1px solid var(--border); z-index: 2000; justify-content: space-around; }
        .nav-item { color: #555; text-align: center; flex: 1; font-size: 10px; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); }

        /* NOTIFICATION CARDS */
        .notif-card { background: #151515; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
        .notif-card h3 { margin: 0 0 5px; font-size: 16px; color: var(--primary); }
        .notif-card p { margin: 0; font-size: 13px; color: #bbb; }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <h1>WASI TV</h1>
        <div class="notif-btn" onclick="goToHash('#notif'); loadTab('notif', this)">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="slider-container"></div>
    <div id="main-content"></div>

    <!-- PLAYER -->
    <div id="player-overlay">
        <video id="main-video" playsinline></video>
        <div style="position:absolute; top:20px; left:20px; z-index:100;">
            <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size:30px; color:#fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8);"></i>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="goToHash('#tv'); loadTV(this)"><i class="fa-solid fa-tv"></i>TV</div>
        <div class="nav-item" onclick="goToHash('#trending'); loadTrending(this)"><i class="fa-solid fa-fire"></i>Trending</div>
        <div class="nav-item" onclick="goToHash('#missing'); loadTab('missing', this)"><i class="fa-solid fa-circle-question"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function goToHash(h) { history.pushState(null, '', h); }

        window.onpopstate = function() {
            const h = window.location.hash;
            if (h === "" || h === "#home") { closePlayer(); loadTab('home', $('.nav-item').first()); }
            else if (h === "#tv") loadTV();
            else if (h === "#trending") loadTrending();
            else if (h === "#missing") loadTab('missing');
            else if (h === "#notif") loadTab('notif');
        };

        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#main-content, #slider-container').hide();
            
            if(tab === 'home') {
                const r = await fetch(`${API}/feed`).then(r=>r.json());
                renderSlider(r.slider);
                $('#main-content').show().html('');
                renderSection('Live Free Sports', r.sports);
            } else if(tab === 'missing') {
                $('#main-content').show().html('<div class="section-title">Missing Sports</div><div id="missing-list" class="playlist-grid"></div>');
                db.ref('missing_sports').once('value', s => renderSectionIn('missing-list', Object.values(s.val() || {})));
            } else if(tab === 'notif') {
                $('#main-content').show().html('<div style="padding:15px;"><div class="section-title">Inbox</div><div id="notif-list"></div></div>');
                loadInbox();
            }
        }

        async function loadTV(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#slider-container, #main-content').hide();
            const r = await fetch(`${API}/feed`).then(r=>r.json());
            $('#main-content').show().html('');
            renderSection('All Live TV', r.channels);
        }

        async function loadTrending(el) {
            $('.nav-item').removeClass('active'); if(el) $(el).addClass('active');
            $('#slider-container, #main-content').hide();
            const r = await fetch(`${API}/movies`).then(r=>r.json());
            $('#main-content').show().html('');
            r.forEach(sec => renderSection(sec.title, sec.items));
        }

        function renderSection(title, items) {
            if(!items) return;
            let html = `<div class="section-title">${title}</div><div class="playlist-grid">`;
            items.forEach(i => {
                const port = (i.type !== 'channel') ? 'portrait' : '';
                html += `<div class="card ${port}" onclick="playStream('${i.slug}','${i.type||'channel'}','${i.name||i.channelName}')">
                    <img src="${i.image || i.logo}" loading="lazy">
                    <div class="card-title">${i.name || i.channelName}</div>
                </div>`;
            });
            $('#main-content').append(html + '</div>');
        }

        function renderSectionIn(divId, items) {
            let html = '';
            items.forEach(i => {
                html += `<div class="card" onclick="playStream('${i.slug}','channel','${i.channelName}')">
                    <img src="${i.logo}" loading="lazy">
                    <div class="card-title">${i.channelName}</div>
                </div>`;
            });
            $('#' + divId).html(html);
        }

        function playStream(slug, type, name) {
            goToHash('#player');
            if(window.Android) window.Android.rotateLandscape();
            $('#player-overlay').show();
            let url = slug.startsWith('http') ? slug : API + "/stream?slug=" + slug + "&type=" + type;
            // logic same as before...
            if (Hls.isSupported()) { hls.destroy(); hls = new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
            else { video.src = url; video.play(); }
        }

        function closePlayer() { video.pause(); $('#player-overlay').hide(); if(window.Android) window.Android.rotatePortrait(); }

        function loadInbox() {
            db.ref('app_notifications').once('value', s => {
                localStorage.setItem('seen_notif', Object.keys(s.val() || {}).length);
                $('#notif-badge').hide();
                let html = Object.values(s.val() || {}).reverse().map(n => `<div class="notif-card"><h3>${n.title}</h3><p>${n.message}</p></div>`).join('');
                $('#notif-list').html(html || '<p style="color:#555">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('seen_notif') || 0;
            if(count > seen) $('#notif-badge').text(count - seen).css('display','flex');
        });

        function renderSlider(data) {
            if(!data) return;
            let html = data.map((s,i) => `<div class="slide ${i===0?'active':''}" onclick="playStream('${s.slug}','${s.type}','${s.name}')"><img src="${s.image}"></div>`).join('');
            $('#slider-container').html(html).show();
            setInterval(() => { let cur = $('.slide.active'), nxt = cur.next().length ? cur.next() : $('.slide').first(); cur.removeClass('active'); nxt.addClass('active'); }, 4000);
        }

        $(document).ready(() => { history.replaceState(null, '', '#home'); loadTab('home', $('.nav-item').first()); });
    </script>
</body>
</html>
