<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV — Pro Final Fix</title>

    <style>
        :root { --primary: #ff9800; --bg: #000; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        header { padding: 12px; text-align: center; background: #121212; position: sticky; top: 0; z-index: 900; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary); font-size: 20px; margin: 0; font-weight: 900; }

        .skeleton { background: #1a1a1a; background-image: linear-gradient(90deg, #1a1a1a 0px, #262626 40px, #1a1a1a 80px); background-size: 200% 100%; animation: shine 1.2s infinite linear; border-radius: 12px; height: 110px; width: 100%; }
        @keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .playlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 15px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; text-align: center; cursor: pointer; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; padding: 5px; background: #fff; }
        .card-title { font-size: 10px; font-weight: 700; color: #000; padding: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* PLAYER UI (Screenshot Style) */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: top left; margin-left: 100vw; }
        #main-video { width: 100%; height: 100%; background: #000; }
        .player-ui { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; transition: 0.3s; }
        .ui-hidden { opacity: 0; pointer-events: none; }
        .p-top { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .p-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; }
        .p-center i { color: #fff; font-size: 35px; }
        .p-center .fa-circle-pause, .p-center .fa-circle-play { font-size: 60px; }
        .p-bottom { padding: 20px; }
        .p-seekbar { width: 100%; accent-color: var(--primary); }

        /* NOTIFICATION STYLING */
        #notif-page { display: none; padding: 15px; }
        .notif-card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid var(--primary); animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .notif-card h3 { margin: 0; font-size: 16px; color: var(--primary); }
        .notif-card p { margin: 5px 0; font-size: 13px; color: #bbb; }
        .notif-time { font-size: 10px; color: #666; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; display: flex; padding: 10px 0; border-top: 1px solid #333; z-index: 2000; }
        .nav-item { color: #888; text-align: center; flex: 1; font-size: 10px; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
        
        .error-btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div style="width: 40px;"></div>
        <h1>Wasi TV</h1>
        <i class="fa-solid fa-rotate" onclick="location.reload()" style="color:var(--primary); font-size:18px;"></i>
    </header>

    <div id="main-content"></div>
    
    <div id="notif-page">
        <h2 style="color:var(--primary); margin-left: 10px;">Inbox</h2>
        <div id="notif-list"></div>
    </div>

    <!-- PLAYER -->
    <div id="player-overlay" onclick="$('.player-ui').toggleClass('ui-hidden')">
        <video id="main-video" playsinline></video>
        <div class="player-ui">
            <div class="p-top">
                <i class="fa-solid fa-arrow-left" onclick="closePlayer()" style="font-size:24px;"></i>
                <span id="p-title" style="font-weight:bold;">Channel</span>
                <i class="fa-solid fa-gear"></i>
            </div>
            <div class="p-center">
                <i class="fa-solid fa-rotate-left" onclick="video.currentTime -= 5"></i>
                <i class="fa-solid fa-circle-pause" id="pp-btn" onclick="togglePlay()"></i>
                <i class="fa-solid fa-rotate-right" onclick="video.currentTime += 15"></i>
            </div>
            <div class="p-bottom">
                <input type="range" class="p-seekbar" id="seekbar" min="0" max="100" value="0" oninput="manualSeek(this.value)">
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:5px;">
                    <span id="curr-time">00:00</span>
                    <span id="dur-time">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="loadTab('missing', this)"><i class="fa-solid fa-trophy"></i>Missing</div>
        <div class="nav-item" onclick="loadTab('notif', this)"><i class="fa-solid fa-bell"></i>Inbox</div>
    </div>

    <script>
        const API = "https://wasitv.lovable.app/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();

        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. FAST LOADING WITH TIMEOUT
        async function smartFetch(url, cacheKey) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 8000); // 8 sec timeout

            try {
                const response = await fetch(url, { signal: controller.signal });
                const data = await response.json();
                localStorage.setItem(cacheKey, JSON.stringify(data));
                clearTimeout(id);
                return data;
            } catch (e) {
                console.log("Fetch failed, using cache");
                return JSON.parse(localStorage.getItem(cacheKey));
            }
        }

        async function loadTab(tab, el) {
            $('.nav-item').removeClass('active'); $(el).addClass('active');
            $('#main-content, #notif-page').hide();
            
            if(tab === 'notif') { $('#notif-page').show(); loadInbox(); return; }
            
            $('#main-content').show().html('<div class="playlist-grid">' + Array(9).fill('<div class="skeleton"></div>').join('') + '</div>');

            let data;
            if(tab === 'home') data = await smartFetch(`${API}/sports`, 'h_cache');
            else if(tab === 'tv') { 
                let raw = await smartFetch(`${API}/feed`, 't_cache');
                data = raw ? raw.channels : null;
            }
            else if(tab === 'missing') { loadMissing(); return; }

            if(data) renderGrid(data);
            else $('#main-content').html('<div style="text-align:center; padding:50px;"><p>Network Error!</p><button class="error-btn" onclick="location.reload()">Retry</button></div>');
        }

        function renderGrid(items) {
            let html = '<div class="playlist-grid">';
            items.forEach(i => {
                const name = i.name || i.channelName;
                const img = i.image || i.logo;
                const slug = i.slug || i.channelSlug;
                html += `<div class="card" onclick="playStream('${slug}', '${i.type || 'channel'}', '${name}')">
                    <img src="${img}" onerror="this.src='https://i.ibb.co/hR0p3p5/colorshd.png'"><div class="card-title">${name}</div>
                </div>`;
            });
            $('#main-content').html(html + '</div>');
        }

        // 2. REAL-TIME NOTIFICATIONS (FIXED)
        function loadInbox() {
            $('#notif-list').html('<div class="skeleton" style="height:60px; margin:10px;"></div>');
            db.ref('app_notifications').on('value', (snapshot) => {
                const data = snapshot.val();
                let html = '';
                if(data) {
                    Object.values(data).reverse().forEach(n => {
                        html += `<div class="notif-card">
                            <h3>${n.title}</h3>
                            <p>${n.message}</p>
                            <span class="notif-time">${n.time || 'Just now'}</span>
                        </div>`;
                    });
                    $('#notif-list').html(html);
                } else {
                    $('#notif-list').html('<p style="text-align:center; margin-top:20px;">No messages in inbox.</p>');
                }
            }, (error) => {
                $('#notif-list').html('<p>Firebase Error: Check Connection</p>');
            });
        }

        // 3. MISSING SPORTS (FIXED)
        function loadMissing() {
            db.ref('missing_sports').once('value', (s) => {
                const data = s.val();
                if(data) renderGrid(Object.values(data));
                else $('#main-content').html('<p style="text-align:center; padding:20px;">No Live Events</p>');
            });
        }

        // 4. PLAYER LOGIC
        async function playStream(slug, type, name) {
            $('#p-title').text(name);
            $('#player-overlay').show();
            let url = slug.startsWith('http') ? slug : (await fetch(`${API}/stream?slug=${slug}&type=${type}`).then(r=>r.json())).url;
            if (Hls.isSupported()) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else { video.src = url; video.play(); }
        }

        function togglePlay() { 
            if(video.paused) { video.play(); $('#pp-btn').attr('class', 'fa-solid fa-circle-pause'); }
            else { video.pause(); $('#pp-btn').attr('class', 'fa-solid fa-circle-play'); }
        }
        function closePlayer() { video.pause(); $('#player-overlay').hide(); }
        function manualSeek(v) { video.currentTime = (v/100) * video.duration; }

        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime/video.duration)*100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#curr-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        $(document).ready(() => loadTab('home', $('.nav-item').first()));
    </script>
</body>
</html>
