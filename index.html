<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Ultimate</title>

    <style>
        :root { --primary: #f07d3a; --bg: #000; --card-white: #fff; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: #121212; color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        /* HEADER JAZZ STYLE */
        header { padding: 15px; background: #000; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .pill-logo { background: #d32f2f; color: #fff; padding: 4px 35px; border-radius: 20px; font-weight: 900; font-size: 18px; }
        .notif-icon { position: absolute; right: 20px; font-size: 22px; color: #fff; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: red; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

        /* SLIDER (FETCH FROM LOVABLE) */
        #slider-container { width: 100%; height: 190px; overflow: hidden; position: relative; display: none; margin-bottom: 10px; }
        .slide { width: 100%; height: 100%; position: absolute; display: none; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* GRID & CARDS (NO MARQUEE) */
        .section-title { padding: 15px 15px 5px; font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
        .card { background: var(--card-white); border-radius: 12px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; text-align: center; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 12px; }
        .card-name { background: #fff; color: #000; padding: 8px 4px; font-size: 10px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid #eee; text-transform: uppercase; }

        /* PLAYER OVERLAY (FORCED LANDSCAPE) */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #main-video { width: 100%; height: 100%; transition: 0.3s; }
        .fit-contain { object-fit: contain !important; }
        .fit-cover { object-fit: cover !important; }
        .fit-fill { object-fit: fill !important; }

        .p-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transition: 0.4s ease; z-index: 10002; }
        .ui-hide { opacity: 0; pointer-events: none; }

        .p-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 50px; z-index: 10005; pointer-events: none; }
        .p-center i, .play-wrapper { pointer-events: auto; }
        
        /* WHITE SPINNER AROUND CIRCLE PLAY BUTTON */
        .play-wrapper { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .white-spinner { position: absolute; width: 80px; height: 80px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .play-btn-circle { width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 25px; cursor: pointer; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .seekbar { width: 100%; accent-color: var(--primary); height: 4px; cursor: pointer; }
        .fit-btn { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid #666; padding: 5px 12px; border-radius: 5px; font-size: 11px; font-weight: bold; }

        /* FOOTER & NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; padding: 10px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; color: #666; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: var(--primary); padding: 6px 25px; border-radius: 20px; margin-top: -5px; color: #fff; }

        .wa-btn { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 999; }
        
        /* LANDSCAPE FORCE CLASS */
        .landscape-mode { width: 100vh !important; height: 100vw !important; transform: rotate(90deg); transform-origin: top left; margin-left: 100vw; position: fixed; inset: 0; }
    </style>
</head>
<body>

    <header>
        <div class="pill-logo">Jazz Tv</div>
        <div class="notif-icon" onclick="goToHash('#notif'); loadTab('notif')">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="slider-container"></div>
    <div id="app-content"></div>

    <a href="https://wa.me/923342002756" class="wa-btn"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- PLAYER -->
    <div id="player-overlay" onclick="togglePlayerUI()">
        <video id="main-video" class="fit-contain" playsinline></video>
        <div class="p-ui" id="p-controls">
            <div class="p-top" onclick="event.stopPropagation()">
                <div style="display:flex; align-items:center; gap:15px;">
                    <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
                    <span id="v-title" style="font-weight:700;">Loading...</span>
                </div>
                <div style="display:flex; gap:20px;"><i class="fa-solid fa-chromecast"></i><i class="fa-solid fa-lock-open" id="lock-icon" onclick="toggleLock(event)"></i></div>
            </div>
            
            <div class="p-center" id="ctrl-center">
                <i class="fa-solid fa-backward-step" onclick="event.stopPropagation(); video.currentTime -= 10"></i>
                <div class="play-wrapper" onclick="event.stopPropagation()">
                    <div class="white-spinner" id="p-loader"></div>
                    <div class="play-btn-circle" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></div>
                </div>
                <i class="fa-solid fa-forward-step" onclick="event.stopPropagation(); video.currentTime += 10"></i>
            </div>

            <div class="p-bottom" id="ctrl-bottom" onclick="event.stopPropagation()">
                <input type="range" class="seekbar" id="seekbar" value="0" step="0.1" oninput="manualSeek(this.value)">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                    <span id="c-time" style="font-size:11px;">00:00</span>
                    <button class="fit-btn" onclick="toggleFit()">FIT: <span id="fit-text">Contain</span></button>
                    <span style="color:#ff4444; font-weight:900; font-size:11px;">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="goToHash('#tv'); loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="goToHash('#missing'); loadTab('missing', this)"><i class="fa-solid fa-circle-exclamation"></i>Missing</div>
    </div>

    <script>
        let token = "";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        let uiTimeout, isLocked = false, currentFit = 0;

        // Firebase Setup
        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- Jazz Decryption Logic (V6/V3) ---
        function decrypt(e) {
            try {
                const kR = "gTOwkDMjlDZ0EjY58GcsVWM4oGOllnd4VzN3UmZsBHc";
                const k = CryptoJS.enc.Utf8.parse(atob(kR.split('').reverse().join('')));
                const iv = CryptoJS.enc.Utf8.parse("fpmjlrbhpljoennm");
                const d = CryptoJS.AES.decrypt({ ciphertext: CryptoJS.enc.Hex.parse(e) }, k, { iv: iv });
                return JSON.parse(d.toString(CryptoJS.enc.Utf8));
            } catch (e) { return null; }
        }

        async function getAuth() {
            if(token) return token;
            const r = await fetch('https://web.jazztv.pk/alpha/api_gateway/v6/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: "S29Pb3Q3eTl4dnUxRk5HME9sa0dXdVh0QjZmNXpoRDBAd2ViLmNvbQ==", city: "S29Pb3Q3eTl4dnUxRk5HME9sa0dXdVh0QjZmNXpoRDA" })
            });
            const d = await r.json(); token = d.token; return token;
        }

        // --- Navigation ---
        function goToHash(h) { history.pushState(null, '', h); }
        window.onpopstate = () => {
            const h = window.location.hash;
            if (h !== "#player") { closePlayer(); handleRouting(h); }
        };

        function handleRouting(h) {
            if (h === "#tv") loadTab('tv', $('.nav-item')[1]);
            else if (h === "#missing") loadTab('missing', $('.nav-item')[2]);
            else if (h === "#notif") loadTab('notif');
            else loadTab('home', $('.nav-item')[0]);
        }

        // --- Slider (wasitv.lovable.app) ---
        async function loadSlider() {
            try {
                const r = await fetch('https://wasitv.lovable.app/api/public/slider').then(res => res.json());
                let html = '';
                r.forEach((s, idx) => { html += `<div class="slide" ${idx===0?'style="display:block"':''}><img src="${s.image}"></div>`; });
                $('#slider-container').html(html).show();
                let current = 0;
                setInterval(() => {
                    const slides = $('.slide');
                    if(slides.length < 2) return;
                    slides.eq(current).fadeOut(500);
                    current = (current + 1) % slides.length;
                    slides.eq(current).fadeIn(500);
                }, 4000);
            } catch(e) { $('#slider-container').hide(); }
        }

        // --- Tab Loading ---
        async function loadTab(tab, el) {
            if(el) { $('.nav-item').removeClass('active'); $(el).addClass('active'); }
            $('#app-content').html('<div style="text-align:center;padding:50px;color:#666;">Loading...</div>');
            $('#slider-container').hide();

            const t = await getAuth();

            if (tab === 'home') {
                loadSlider();
                const r = await fetch('https://web.jazztv.pk/alpha/api_gateway/v3/web/live-tv', { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ project_id: "2", platform: "web" }) 
                });
                const d = await r.json();
                const channels = d.eData ? decrypt(d.eData).data.channels : d.data.channels;
                render('Featured Channels', channels.slice(0, 9));
            } 
            else if (tab === 'tv') {
                const r = await fetch('https://web.jazztv.pk/alpha/api_gateway/v6/web/live-tv', { 
                    method: 'POST', headers: { 'Authorization': `Bearer ${t}` }, 
                    body: new FormData() 
                });
                const d = decrypt((await r.json()).eData).data.channels;
                render('Live TV Channels', d);
            } 
            else if (tab === 'missing') {
                db.ref('missing_sports').once('value', s => render('Missing Channels', Object.values(s.val() || {})));
            }
            else if (tab === 'notif') {
                loadNotifications();
            }
        }

        function render(title, items) {
            let h = `<div class="section-title">${title}</div><div class="grid">`;
            items.forEach(i => {
                const name = i.channelName || i.name;
                const img = i.logo || i.thumbnail || i.image;
                h += `<div class="card" onclick="playStream('${i.channelSlug || i.slug}','${name}')">
                    <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="card-name">${name}</div>
                </div>`;
            });
            $('#app-content').html(h + '</div>');
        }

        // --- Player System ---
        async function playStream(slug, name) {
            goToHash('#player');
            $('#v-title').text(name);
            $('#player-overlay').fadeIn();
            $('#p-loader').show();
            
            // Auto Rotate logic
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    $('#player-overlay').addClass('landscape-mode');
                });
            } else {
                $('#player-overlay').addClass('landscape-mode');
            }

            try {
                const t = await getAuth();
                const fd = new FormData();
                fd.append("slug", slug); fd.append("type", "channel"); fd.append("phone_details", "WEB");
                const res = await fetch('https://web.jazztv.pk/alpha/api_gateway/v6/web/get-channel-url', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${t}` }, body: fd
                });
                const d = decrypt((await res.json()).eData);
                const url = d.data.ChannelStreamingUrls || d.data.BackupLiveStreamUrl;

                if (Hls.isSupported()) {
                    hls.destroy(); hls = new Hls();
                    hls.loadSource(url); hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else { video.src = url; video.play(); }
                showControls();
            } catch(e) { alert("Stream Error"); }
        }

        function closePlayer() {
            video.pause();
            $('#player-overlay').fadeOut().removeClass('landscape-mode');
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        }

        function togglePlayerUI() { $('#p-controls').hasClass('ui-hide') ? showControls() : hideControls(); }
        function showControls() { $('#p-controls').removeClass('ui-hide'); clearTimeout(uiTimeout); uiTimeout = setTimeout(hideControls, 4000); }
        function hideControls() { $('#p-controls').addClass('ui-hide'); }
        
        function togglePlay() { if(!isLocked) { video.paused ? video.play() : video.pause(); showControls(); } }
        
        function toggleFit() {
            const fits = ['fit-contain', 'fit-cover', 'fit-fill'];
            const labels = ['Contain', 'Cover', 'Fill'];
            $('#main-video').removeClass(fits[currentFit]);
            currentFit = (currentFit + 1) % fits.length;
            $('#main-video').addClass(fits[currentFit]);
            $('#fit-text').text(labels[currentFit]);
            showControls();
        }

        function toggleLock(e) {
            e.stopPropagation(); isLocked = !isLocked;
            $('#lock-icon').attr('class', isLocked ? 'fa-solid fa-lock' : 'fa-solid fa-lock-open');
            isLocked ? $('#ctrl-center, #ctrl-bottom').fadeOut() : $('#ctrl-center, #ctrl-bottom').fadeIn();
            showControls();
        }

        function manualSeek(v) { video.currentTime = (v / 100) * video.duration; showControls(); }

        video.onwaiting = () => $('#p-loader').show();
        video.onplaying = () => { $('#p-loader').hide(); $('#play-icon').attr('class', 'fa-solid fa-pause'); setTimeout(hideControls, 3000); };
        video.onpause = () => { $('#play-icon').attr('class', 'fa-solid fa-play'); showControls(); };
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime / video.duration) * 100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#c-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        function loadNotifications() {
            db.ref('app_notifications').once('value', s => {
                const data = s.val() || {};
                localStorage.setItem('sc', Object.keys(data).length); $('#notif-badge').hide();
                let h = '<div class="section-title">Inbox</div>';
                Object.values(data).reverse().forEach(n => {
                    h += `<div style="background:#222;padding:15px;border-radius:10px;margin:10px;border-left:4px solid var(--primary);"><b>${n.title}</b><p style="font-size:12px;color:#888;margin-top:5px;">${n.message}</p></div>`;
                });
                $('#app-content').html(h || '<p style="text-align:center;padding:50px;color:#555;">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('sc') || 0;
            if(count > seen) $('#notif-badge').text(count-seen).css('display','flex');
        });

        $(document).ready(() => { handleRouting(window.location.hash); });
    </script>
</body>
</html>
