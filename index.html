<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Wasi TV Ultimate Pro</title>

    <style>
        :root { --primary: #f07d3a; --bg: #000; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { margin: 0; background: #121212; color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        /* HEADER */
        header { padding: 15px; background: #000; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .pill-logo { background: #d32f2f; color: #fff; padding: 4px 35px; border-radius: 20px; font-weight: 900; font-size: 18px; }
        .notif-icon { position: absolute; right: 20px; font-size: 22px; color: #fff; cursor: pointer; }
        #notif-badge { position: absolute; top: -5px; right: -5px; background: red; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 1px solid #000; }

        /* SKELETON */
        .skeleton { background: #222; background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 10px; }
        @keyframes loading { to { background-position: -200% 0; } }

        /* GRID */
        .section-title { padding: 15px 15px 5px; font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
        
        /* JAZZ TV CARDS WITH MARQUEE */
        .card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 10px; }
        .card-info { background: #fff; padding: 6px 0; overflow: hidden; border-top: 1px solid #eee; position: relative; }
        
        .marquee-box { white-space: nowrap; display: inline-block; padding-left: 100%; animation: slow-move 10s linear infinite; font-size: 10px; font-weight: 900; color: #000; text-transform: uppercase; }
        @keyframes slow-move { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* --- PRO PLAYER UI --- */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #main-video { width: 100%; height: 100%; object-fit: contain; }

        .p-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transition: 0.3s; z-index: 10002; }
        .ui-hide { opacity: 0; pointer-events: none; }

        /* CENTER CONTROLS WITH SPINNER */
        .p-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 50px; z-index: 10005; }
        
        .play-wrapper { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .white-spinner { position: absolute; width: 80px; height: 80px; border: 4px solid transparent; border-top: 4px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .play-btn-circle { width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 25px; cursor: pointer; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .p-top { display: flex; align-items: center; justify-content: space-between; }
        .p-bottom { width: 100%; }
        .seekbar { width: 100%; accent-color: var(--primary); height: 4px; cursor: pointer; }

        /* NAVIGATION & FAB */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; padding: 10px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; color: #666; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { background: var(--primary); padding: 6px 25px; border-radius: 20px; margin-top: -5px; color: #fff; }

        .wa-btn { position: fixed; bottom: 85px; right: 20px; background: #25d366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 999; }
    </style>
</head>
<body>

    <header>
        <div class="pill-logo">Jazz Tv</div>
        <div class="notif-icon" onclick="goToHash('#notif'); loadTab('notif')">
            <i class="fa-solid fa-bell"></i>
            <span id="notif-badge">0</span>
        </div>
    </header>

    <div id="app-content"></div>

    <a href="https://wa.me/923342002756" class="wa-btn"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay">
        <video id="main-video" playsinline onclick="handleScreenTouch()"></video>

        <div class="p-ui" id="p-controls">
            <div class="p-top">
                <div style="display:flex; align-items:center; gap:15px;">
                    <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
                    <span id="v-title" style="font-weight:700;">Wasi TV</span>
                </div>
                <div style="display:flex; gap:20px;">
                    <i class="fa-solid fa-chromecast"></i>
                    <i class="fa-solid fa-lock-open" id="lock-icon" onclick="toggleLock(event)"></i>
                </div>
            </div>

            <div class="p-center" id="ctrl-center">
                <i class="fa-solid fa-backward-step" onclick="video.currentTime -= 10"></i>
                
                <div class="play-wrapper">
                    <div class="white-spinner" id="p-loader"></div>
                    <div class="play-btn-circle" onclick="togglePlay()">
                        <i class="fa-solid fa-play" id="play-icon"></i>
                    </div>
                </div>

                <i class="fa-solid fa-forward-step" onclick="video.currentTime += 10"></i>
            </div>

            <div class="p-bottom" id="ctrl-bottom">
                <input type="range" class="seekbar" id="seekbar" value="0" step="0.1" oninput="manualSeek(this.value)">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-top:5px;">
                    <span id="c-time">00:00</span>
                    <span style="color:red; font-weight:900;">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="goToHash('#home'); loadTab('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item active" onclick="goToHash('#tv'); loadTab('tv', this)"><i class="fa-solid fa-tv"></i>Live TV</div>
        <div class="nav-item" onclick="goToHash('#movies'); loadTab('movies', this)"><i class="fa-solid fa-clapperboard"></i>Movies</div>
        <div class="nav-item" onclick="goToHash('#missing'); loadTab('missing', this)"><i class="fa-solid fa-circle-exclamation"></i>Missing</div>
    </div>

    <script>
        const API = location.origin + "/api/public";
        const video = document.getElementById('main-video');
        let hls = new Hls();
        let uiTimeout;
        let isLocked = false;

        const firebaseConfig = { databaseURL: "https://wasitv-63ff0-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- BACK NAVIGATION LOGIC ---
        function goToHash(h) { history.pushState(null, '', h); }

        window.onpopstate = function() {
            const h = window.location.hash;
            if (h === "#player") { /* Stay */ }
            else { closePlayerUI(); handleRouting(h); }
        };

        function handleRouting(h) {
            if (h === "#home") loadTab('home', $('.nav-item')[0]);
            else if (h === "#movies") loadTab('movies', $('.nav-item')[2]);
            else if (h === "#missing") loadTab('missing', $('.nav-item')[3]);
            else if (h === "#notif") loadTab('notif');
            else loadTab('tv', $('.nav-item')[1]);
        }

        // --- CONTENT LOADING ---
        async function loadTab(tab, el) {
            if(el) { $('.nav-item').removeClass('active'); $(el).addClass('active'); }
            $('#app-content').html('<div class="grid">' + '<div class="skeleton" style="aspect-ratio:1/1.2;"></div>'.repeat(9) + '</div>');

            if (tab === 'tv' || tab === 'home') {
                const r = await fetch(`${API}/feed`).then(r => r.json());
                render(tab === 'tv' ? 'Channels' : 'Featured', tab === 'tv' ? r.channels : r.sports);
            } else if (tab === 'missing') {
                db.ref('missing_sports').once('value', s => render('Missing', Object.values(s.val() || {})));
            } else if (tab === 'movies') {
                const r = await fetch(`${API}/movies`).then(r => r.json());
                let h = ''; r.forEach(s => {
                    h += `<div class="section-title">${s.title}</div><div class="grid">`;
                    s.items.forEach(i => h += createCard(i));
                    h += '</div>';
                });
                $('#app-content').html(h);
            } else if (tab === 'notif') {
                loadNotifications();
            }
        }

        function createCard(i) {
            const name = i.name || i.channelName || "Unknown";
            const img = i.logo || i.image || "https://via.placeholder.com/150";
            return `<div class="card" onclick="playStream('${i.slug}','${name}')">
                <img src="${img}" onerror="this.src='https://via.placeholder.com/150'">
                <div class="card-info"><div class="marquee-box">${name} &nbsp; • &nbsp; ${name}</div></div>
            </div>`;
        }

        function render(title, items) {
            let h = `<div class="section-title">${title}</div><div class="grid">`;
            items.forEach(i => h += createCard(i));
            $('#app-content').html(h + '</div>');
        }

        // --- PLAYER CONTROLS ---
        function playStream(slug, name) {
            goToHash('#player');
            $('#v-title').text(name);
            $('#player-overlay').fadeIn();
            $('#p-loader').show();
            if(window.Android) window.Android.rotateLandscape();

            let url = slug.startsWith('http') ? slug : `${API}/stream?slug=${slug}&type=channel`;
            if (Hls.isSupported()) {
                hls.destroy(); hls = new Hls();
                hls.loadSource(url); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else { video.src = url; video.play(); }
            showControls();
        }

        function closePlayerUI() {
            video.pause();
            $('#player-overlay').fadeOut();
            if(window.Android) window.Android.rotatePortrait();
        }

        function togglePlay() { 
            if(isLocked) return;
            video.paused ? video.play() : video.pause(); 
            resetTimer(); 
        }

        function toggleLock(e) {
            e.stopPropagation();
            isLocked = !isLocked;
            if(isLocked) {
                $('#lock-icon').attr('class', 'fa-solid fa-lock');
                $('#ctrl-center, #ctrl-bottom').fadeOut();
            } else {
                $('#lock-icon').attr('class', 'fa-solid fa-lock-open');
                $('#ctrl-center, #ctrl-bottom').fadeIn();
                resetTimer();
            }
        }

        function handleScreenTouch() {
            if(isLocked) {
                $('#p-controls').removeClass('ui-hide');
                resetTimer();
                return;
            }
            if ($('#p-controls').hasClass('ui-hide')) showControls();
            else hideControls();
        }

        function showControls() { $('#p-controls').removeClass('ui-hide'); resetTimer(); }
        function hideControls() { $('#p-controls').addClass('ui-hide'); }
        function resetTimer() { clearTimeout(uiTimeout); uiTimeout = setTimeout(hideControls, 4000); }
        function manualSeek(v) { if(!isLocked) video.currentTime = (v / 100) * video.duration; }

        video.onwaiting = () => $('#p-loader').show();
        video.onplaying = () => { 
            $('#p-loader').hide(); 
            $('#play-icon').attr('class', 'fa-solid fa-pause');
            resetTimer();
        };
        video.onpause = () => {
            $('#play-icon').attr('class', 'fa-solid fa-play');
            showControls();
        };
        video.ontimeupdate = () => {
            $('#seekbar').val((video.currentTime / video.duration) * 100 || 0);
            let m=Math.floor(video.currentTime/60), s=Math.floor(video.currentTime%60);
            $('#c-time').text((m<10?'0':'')+m+":"+(s<10?'0':'')+s);
        };

        function loadNotifications() {
            db.ref('app_notifications').once('value', s => {
                const data = s.val() || {};
                localStorage.setItem('scount', Object.keys(data).length);
                $('#notif-badge').hide();
                let h = '<div class="section-title">Notifications</div>';
                Object.values(data).reverse().forEach(n => {
                    h += `<div style="background:#222; padding:15px; border-radius:10px; margin:10px; border-left:4px solid var(--primary);">
                            <b>${n.title}</b><p style="font-size:12px;color:#888;margin:5px 0 0;">${n.message}</p>
                          </div>`;
                });
                $('#app-content').html(h || '<p style="text-align:center;padding:50px;">No messages</p>');
            });
        }

        db.ref('app_notifications').on('value', s => {
            const count = Object.keys(s.val() || {}).length;
            const seen = localStorage.getItem('scount') || 0;
            if(count > seen) $('#notif-badge').text(count-seen).css('display','flex');
        });

        $(document).ready(() => handleRouting(window.location.hash));
    </script>
</body>
</html>
